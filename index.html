<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Up Anilha">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Up Anilha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: single column phone app, sticky header, bottom tab bar, rest timer docked above it. Plate colors (IWF 20 kg blue, 15 kg yellow) drive the accents. */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#e2e6ec; --ink:#141820; --muted:#5b6474; --line:#d5dae2;
  --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#dfe7fb;
  --hot:#e9b10f; --hot-ink:#1a1400; --good:#18804a; --good-soft:#dcf1e5; --danger:#c2362b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1015; --surface:#171a22; --sunk:#1f232d; --ink:#eceef3; --muted:#98a0b0; --line:#2a2f3b;
  --accent:#6a8eff; --accent-ink:#0a0d14; --accent-soft:#1d2645;
  --hot:#f2c230; --hot-ink:#1a1400; --good:#43c983; --good-soft:#15301f; --danger:#ff6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#171a22; --sunk:#1f232d; --ink:#eceef3; --muted:#98a0b0; --line:#2a2f3b;
  --accent:#6a8eff; --accent-ink:#0a0d14; --accent-soft:#1d2645;
  --hot:#f2c230; --hot-ink:#1a1400; --good:#43c983; --good-soft:#15301f; --danger:#ff6b5e; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 180px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.005em}
h3{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;margin:0;text-transform:uppercase}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--sunk);min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;min-height:56px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
/* plate badge */
.plate{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--accent-ink) 22%,transparent),inset 0 0 0 16px var(--accent),inset 0 0 0 17px color-mix(in srgb,var(--accent-ink) 30%,transparent)}
.plate.sm{width:40px;height:40px;font-size:21px;box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-family:var(--display);font-size:18px;min-width:48px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.exlist{list-style:none;margin:0;padding:0}
.exlist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exlist li:first-child{border-top:0}
.exlist .n{min-width:0;font-weight:600}
.exlist .t{flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
/* week dots */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week span{font-size:11px;color:var(--muted);font-weight:600}
.week .wd{display:grid;place-items:center;margin:4px auto 0;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;color:var(--accent-ink);font-weight:800;font-size:14px}
.week .wd:disabled{opacity:.35;cursor:default}
.week .wd.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.week .wd.done{background:var(--accent);border-color:var(--accent)}
.week .wd.today{border-color:var(--ink)}
/* session */
.ex{padding:14px 14px 10px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head>div{min-width:0}
.ex-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.last{font-size:13px;color:var(--muted);margin-top:4px}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:6px 8px;align-items:center;margin-top:10px}
.sets .h{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sets .i{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-size:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.sets input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.chk{width:52px;height:46px;border-radius:10px;border:2px solid var(--line);background:transparent;font-size:20px;font-weight:800;color:var(--muted)}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.setrow-done input{background:var(--good-soft);border-color:transparent}
.platecalc{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-2px;font-variant-numeric:tabular-nums}
.ex-foot{display:flex;gap:8px;margin-top:8px}
.ex-foot .btn{flex:1}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--good);transition:width .3s}
/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 8px}
.rest-in{max-width:560px;margin:0 auto;background:var(--hot);color:var(--hot-ink);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.rest-in .clock{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;min-width:96px}
.rest-in .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0}
.rest-in button{border:0;background:rgb(0 0 0 / .12);color:inherit;border-radius:10px;min-height:42px;padding:0 12px;font-weight:700}
.rest.done .rest-in{background:var(--good);color:#fff}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;height:64px;font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.hist li{display:block}
.hist .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.chart{width:100%;height:auto;display:block}
select.sel{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-weight:600}
/* editor */
.ed-ex{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.ed-ex:first-of-type{border-top:0}
.ed-ex input[type=text],.ed-ex input[type=number],.ed-ex select,.wname{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
.ed-grid{display:grid;grid-template-columns:64px 1fr 1fr auto;gap:8px;align-items:end}
.ed-grid label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;min-width:0}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600;padding-bottom:9px}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.ed-tools{display:flex;gap:6px;justify-content:flex-end}
.ic{width:38px;height:36px;border-radius:9px;border:1px solid var(--line);background:transparent;font-weight:700}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.big{display:flex;align-items:baseline;gap:6px;font-family:var(--display);font-weight:800;line-height:1}
.big b{font-size:54px}.big span{font-size:26px;color:var(--muted)}
.btn.checked{background:var(--good-soft);color:var(--good)}
.mrow{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
details.goals summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.stepper{display:flex;align-items:center;gap:10px}.stepper b{min-width:24px;text-align:center;font-size:18px}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
.pf .full{grid-column:1/-1}
.pf select,.pf textarea{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-size:15px;font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0;width:100%;min-width:0;resize:vertical;font-family:var(--body)}
.chatlog{display:flex;flex-direction:column;gap:8px}
#chatlog{height:min(48vh,440px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.cmore{align-self:center;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;margin-bottom:4px}
.cday{display:flex;justify-content:center;margin:6px 0 2px}
.cday span{background:var(--sunk);color:var(--muted);font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;box-shadow:0 1px 2px rgb(0 0 0 / .2)}
.msg .mt{display:block;text-align:right;font-size:10.5px;opacity:.6;margin-top:3px;line-height:1}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.msg.ai{background:var(--sunk);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.dots{color:var(--muted)}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.chip.sug{font-family:var(--body);font-size:14px;font-weight:600;padding:8px 12px;text-align:left}
.chatform{display:flex;gap:8px;align-items:flex-end}
.chatform textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px;font-size:15px;resize:none;font-family:var(--body);color:var(--ink)}
.warn{font-size:13px;line-height:1.4;background:color-mix(in srgb,var(--hot) 18%,var(--surface));border-radius:10px;padding:8px 10px;margin-top:6px}
.swapbtn{display:block;margin-top:6px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.warnbox{background:color-mix(in srgb,var(--hot) 14%,var(--surface))}
.flag{font-size:12px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--hot) 35%,transparent);border-radius:6px;padding:1px 6px;white-space:nowrap}
.care ul{margin:4px 0 0;padding-left:18px;font-size:14px}.care li{margin:2px 0}
fieldset.restr{border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;margin:0;display:flex;flex-direction:column;gap:2px}
fieldset.restr legend{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 4px}
fieldset.restr .tog{padding:6px 0;font-size:15px}
.brand .up{color:var(--accent)}
.pf fieldset.restr label.tog{flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:15px;font-weight:500;color:var(--ink);text-align:left;padding:6px 0}
.pf fieldset.restr label.tog input{flex:none;width:20px;height:20px;margin:0}
.adapted{font-size:13px;color:var(--good);font-weight:600}
.flag.ok{background:var(--good-soft);color:var(--good)}
.brandrow{display:flex;align-items:center;gap:9px}
.logo{width:34px;height:34px;flex:none;border-radius:9px;display:block}
.avatar{margin-left:auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--sunk);color:var(--muted);display:grid;place-items:center;padding:0;overflow:hidden;font-family:var(--display);font-weight:800;font-size:18px}
.avatar.on{border-color:var(--accent)}
.avatar img,.av img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg,.av svg{width:60%;height:60%}
.av{border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;overflow:hidden;flex:none;font-family:var(--display);font-weight:800}
.av.sm{width:44px;height:44px;font-size:20px}.av.md{width:52px;height:52px;font-size:22px}.av.xl{width:120px;height:120px;font-size:48px}
.hello{display:flex;align-items:center;gap:12px}
.hello-n{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase}
.welcome{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input{text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink)}
.howbtn{display:inline-block;margin:6px 0 2px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--accent)}
.howic{color:var(--accent);font-weight:800}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-weight:600;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.chip.sm{font-size:15px;padding:6px 12px;min-width:0}
.glist{display:flex;flex-direction:column;gap:8px}
.gitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;color:var(--ink)}
.gitem img,.gnoimg{width:84px;height:58px;border-radius:8px;object-fit:cover;flex:none;background:var(--sunk)}
.gnoimg{display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.gtxt{display:flex;flex-direction:column;min-width:0;flex:1}.gtxt b{font-size:15px}.gtxt span{font-size:13px;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:50;background:rgb(0 0 0 / .5);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.gfig{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/2;max-width:100%;background:var(--sunk)}
.gfig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
#gimg1{opacity:0}
.gfig-l{position:absolute;left:8px;bottom:8px;background:rgb(0 0 0 / .6);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.gsec p{margin:4px 0 0}.gsec ol,.gsec ul{margin:6px 0 0;padding-left:20px}.gsec li{margin:4px 0}
.errs li::marker{color:var(--danger)}
.gtip{background:var(--good-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
body.noscroll{overflow:hidden}
@media (prefers-reduced-motion:reduce){#gimg1{display:none}}
.btn.sm{white-space:nowrap}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.welcome .row{flex-wrap:wrap}
.wzhead{display:flex;align-items:center;gap:12px}
.wzbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}.wzbar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;color:var(--ink)}
.opt b{font-size:17px}.opt span{font-size:14px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.chk2{flex-direction:row;align-items:center;gap:12px;cursor:pointer}.opt.chk2 input{width:22px;height:22px;flex:none;accent-color:var(--accent)}.opt.chk2 b{font-size:15px;font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:var(--hot);color:var(--hot-ink);border-radius:999px;padding:2px 8px;vertical-align:middle}
.daysel .chip{min-width:52px}

<div class="fab" id="fab"><div class="fabtip" id="fabTip" hidden></div><div class="fabpanel" id="fabPanel" hidden role="dialog" aria-label="Conversa com a Driffa"></div><button class="fabbtn" id="fabBtn" aria-label="Falar com a Driffa" aria-expanded="false"></button></div>

<script src="guide.js"></script>
<script>
(function(){
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtKg=n=>(Math.round(n*100)/100).toLocaleString('pt-BR');
const E=(name,sets,reps,rest,bar)=>({id:uid(),name,sets,reps,rest,bar:!!bar});
const DEFAULT_PLAN={v:2,next:'A',goals:{week:5,month:20},workouts:[
 {id:'A',day:1,name:'Peito e tríceps',ex:[E('Supino inclinado com halteres',3,'10-12',75),E('Supino reto',3,'8-10',90,1),E('Crucifixo (crossover ou halter)',3,'12-15',60),E('Tríceps pulley (corda)',3,'12',60),E('Tríceps testa',3,'10',60)]},
 {id:'B',day:2,name:'Costas e bíceps',ex:[E('Puxada alta aberta',3,'10-12',75),E('Remada baixa (triângulo)',3,'10',75),E('Remada curvada com halteres',3,'12',75),E('Rosca direta (barra W)',3,'10',60),E('Rosca martelo',3,'12',60)]},
 {id:'C',day:3,name:'Cardio e abdominal',ex:[E('Cardio: caminhada inclinada ou bike',1,'30-40 min',0),E('Abdominal supra',3,'20',45),E('Elevação de pernas',3,'15',45),E('Prancha',3,'45-60 s',45)]},
 {id:'D',day:4,name:'Pernas e ombros',ex:[E('Leg press 45°',3,'12',90),E('Cadeira extensora',3,'15',60),E('Mesa flexora',3,'12',60),E('Panturrilha sentada',4,'15',45),E('Desenvolvimento com halteres',3,'10',75),E('Elevação lateral',3,'12-15',60)]},
 {id:'E',day:5,name:'Full body em circuito',ex:[E('Afundo (passada), cada perna',3,'12',60),E('Supino reto com halteres',3,'10',60),E('Puxada alta',3,'10',60),E('Elevação lateral',3,'15',45),E('Rosca direta (super-série)',3,'12',0),E('Tríceps pulley (super-série)',3,'12',75)]}
]};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const S={user:LS.get('ct.user',{name:'',photo:'',skip:false}),chat:LS.get('ct.chat',[]),draft:'',busy:null,plan:LS.get('ct.plan',null)||JSON.parse(JSON.stringify(DEFAULT_PLAN)),sessions:LS.get('ct.sessions',[]),active:LS.get('ct.active',null),view:'hoje',sel:null,edit:null,histEx:null,armed:null,rest:null};
if(S.plan.v!==2&&!S.sessions.length){S.plan={...JSON.parse(JSON.stringify(DEFAULT_PLAN)),profile:S.plan.profile}}
let chatRef=null,sampleApi=null,planRef=null,sessCol=null,armTimer=null,saveTimer=null,audio=null,wake=null;
const main=document.getElementById('main');
function goals(){if(!S.plan.goals)S.plan.goals={week:4,month:16};return S.plan.goals}

function W(id){return S.plan.workouts.find(w=>w.id===id)||S.plan.workouts[0]}
function toast(msg){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast dt';t.innerHTML=coachAv(28)+'<span>'+esc(msg)+'</span>';document.body.appendChild(t);setTimeout(()=>t.remove(),msg.length>60?4800:msg.length>35?3400:2400)}

/* ---------- persistence ---------- */
function savePlan(){LS.set('ct.plan',S.plan);clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(planRef)planRef.set(JSON.parse(JSON.stringify(S.plan))).catch(()=>toast('A nuvem falhou. Sua rotina ficou guardada aqui no celular.'))},500)}
function saveActive(){LS.set('ct.active',S.active)}
function addSession(s){S.sessions=[s,...S.sessions.filter(x=>x.id!==s.id)].sort((a,b)=>a.date<b.date?1:-1);LS.set('ct.sessions',S.sessions);if(sessCol)sessCol.doc(s.id).set(s).catch(()=>toast('Treino guardado aqui no celular. A nuvem fica para depois.'))}
function delSession(id){S.sessions=S.sessions.filter(x=>x.id!==id);LS.set('ct.sessions',S.sessions);if(sessCol)sessCol.doc(id).delete().catch(()=>{})}
function setSync(on,txt){const el=document.getElementById('sync');el.classList.toggle('on',on);el.querySelector('span').textContent=txt}

async function connect(){
  if(!window.claude||!window.claude.use)return;
  let db,user;try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){return}
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const base=db.collection('data/users/'+id);
  planRef=base.doc('plan');sessCol=base.doc('log').collection('sessions');chatRef=base.doc('chat');
  chatRef.onSnapshot(snap=>{if(!snap.exists){if(S.chat.length)chatRef.set({msgs:S.chat.slice(-40)}).catch(()=>{});return}
    if(snap.metadata.hasPendingWrites||S.busy==='chat')return;const d=snap.data();if(d&&Array.isArray(d.msgs)){S.chat=d.msgs;LS.set('ct.chat',S.chat);updateChatLog()}},()=>{});
  let got=false;const to=setTimeout(()=>{if(!got)setSync(false,'Offline · salvo aqui')},10000);
  planRef.onSnapshot(snap=>{got=true;clearTimeout(to);setSync(true,'Sincronizado');
    if(!snap.exists){planRef.set(JSON.parse(JSON.stringify(S.plan))).catch(()=>{});return}
    if(snap.metadata.hasPendingWrites)return;
    const d=snap.data();if(!d||!Array.isArray(d.workouts))return;
    if(d.v!==2&&!S.sessions.length){planRef.set(JSON.parse(JSON.stringify(S.plan))).catch(()=>{});return}
    S.plan=d;LS.set('ct.plan',d);
    const editing=main.contains(document.activeElement)&&document.activeElement.tagName!=='BUTTON';
    if(!editing)render();
  },()=>setSync(false,'Offline · salvo aqui'));
  let migrated=false;
  sessCol.orderBy('date','desc').limit(400).onSnapshot(q=>{
    const remote=q.docs.map(d=>d.data());
    if(!migrated){migrated=true;const ids=new Set(remote.map(r=>r.id));S.sessions.filter(s=>!ids.has(s.id)).forEach(s=>sessCol.doc(s.id).set(s).catch(()=>{}));
      if(remote.length===0&&S.sessions.length)return;}
    if(q.metadata.hasPendingWrites)return;
    S.sessions=remote;LS.set('ct.sessions',remote);
    if(S.view!=='rotina')render();
  },()=>{});
}

/* ---------- helpers ---------- */
function lastFor(exId,name){for(const s of S.sessions){const e=s.ex.find(x=>x.exId===exId)||s.ex.find(x=>x.name===name);if(e&&e.sets.length)return{date:s.date,sets:e.sets}}return null}
function plates(kg){if(!(kg>20))return '';let side=(kg-20)/2;const out=[];for(const p of [25,20,15,10,5,2.5,1.25]){while(side>=p-1e-9){out.push(p);side-=p}}
  return 'Barra 20 + 2×('+out.map(fmtKg).join(' + ')+')'+(side>0.01?' ≈':'')}
function repsLow(r){const m=String(r).match(/\d+/);return m?m[0]:''}
function dayKey(d){const x=new Date(d);return x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate()}
function vol(s){return s.ex.reduce((a,e)=>a+e.sets.reduce((b,t)=>b+(+t.kg||0)*(+t.reps||0),0),0)}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}).replace('.','')}
function visitSet(){return new Set(S.sessions.map(s=>dayKey(s.date)))}
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const WD=[1,2,3,4,5,6,0],WDS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function avail(){const p=profile();return Array.isArray(p.avail)&&p.avail.length?p.avail:[0,1,2,3,4,5,6]}
function sched(){const p=profile();return Array.isArray(p.sched)&&p.sched.length?p.sched:null}
function spreadDays(av,n){const order=WD.filter(d=>av.includes(d));if(n>=order.length)return order;const out=[];for(let i=0;i<n;i++)out.push(order[Math.round(i*(order.length-1)/Math.max(1,n-1))]);
  if(n===1)return [order.includes(6)?6:order[0]];return [...new Set(out)]}
function daysLeftWeek(){const now=new Date(),ds=visitSet(),out=[];const d=new Date(now);d.setHours(12,0,0,0);
  while(true){if(!ds.has(dayKey(d))&&avail().includes(d.getDay()))out.push(d.getDay());if(d.getDay()===0)break;d.setDate(d.getDate()+1)}return out}
function dayList(arr){const n=arr.map(d=>WDS[d].toLowerCase());return n.length<=1?n.join(''):n.slice(0,-1).join(', ')+' e '+n[n.length-1]}
function dayChips(act,sel){return `<div class="chips daychips">${WD.map(d=>`<button class="chip sm" data-act="${act}" data-v="${d}" aria-pressed="${sel.includes(d)}">${WDS[d]}</button>`).join('')}</div>
  <div class="row presets"><button class="btn ghost sm" data-act="${act}" data-v="all">Todos</button><button class="btn ghost sm" data-act="${act}" data-v="week">Seg a sex</button><button class="btn ghost sm" data-act="${act}" data-v="wknd">Só fim de semana</button><button class="btn ghost sm" data-act="${act}" data-v="mix">Noites + fim de semana</button></div>`}
function toggleDays(arr,v){if(v==='all')return [0,1,2,3,4,5,6];if(v==='week')return [1,2,3,4,5];if(v==='wknd')return [6,0];if(v==='mix')return [2,4,6,0];
  const d=+v,a=arr.slice();const i=a.indexOf(d);if(i>=0){if(a.length>1)a.splice(i,1)}else a.push(d);return a}
function visitsBetween(a,b){const days=new Set();S.sessions.forEach(s=>{const t=new Date(s.date);if(t>=a&&t<b)days.add(dayKey(t))});return days.size}
function streak(){let ws=weekStart(new Date()),n=0;const cg=effGoal(ws);const cur=visitsBetween(ws,new Date(ws.getTime()+7*864e5));if(cg>0&&cur>=cg)n++;
  for(let i=0;i<104;i++){const b=ws;ws=new Date(ws);ws.setDate(ws.getDate()-7);const eg=effGoal(ws);if(eg===0)continue;if(visitsBetween(ws,b)>=eg)n++;else break}return n}
/* ---------- pausa ---------- */
const PAUSE_R={doente:['Doente','🤒'],lesao:['Lesão ou recuperação',''],ferias:['Férias',''],viagem:['Viagem',''],trabalho:['Trabalho pesado',''],outro:['Outro motivo','']};
function pauses(){return LS.get('ct.pauses',[])}
function savePauses(P){LS.set('ct.pauses',P)}
function isoOf(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pauseOn(d){const k=isoOf(d);return pauses().find(p=>p.start<=k&&(!p.end||k<=p.end))||null}
function activePause(){return pauseOn(new Date())}
function pausedDaysIn(ws){let n=0;for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);if(pauseOn(d))n++}return n}
function effGoal(ws){const g=goals().week,p=pausedDaysIn(ws);if(p>=4)return 0;return Math.max(1,Math.round(g*(7-p)/7))}
function recentReturn(){const t=isoOf(new Date());const y=new Date();y.setDate(y.getDate()-3);const lim=isoOf(y);return pauses().find(p=>p.end&&p.end<t&&p.end>=lim)||null}
function fmtISO(k,opt){return new Date(k+'T12:00:00').toLocaleDateString('pt-BR',opt||{day:'numeric',month:'short'}).replace('.','')}
function pauseCard(){const p=activePause();if(!p)return '';const R=PAUSE_R[p.reason]||PAUSE_R.outro;
  return `<div class="card pausecard stack"><div class="row"><span class="pausebadge">❚❚</span><div style="flex:1;min-width:0"><div class="eyebrow">Metas em pausa</div><h3>${R[0]}</h3><div class="muted" style="font-size:13px">Desde ${fmtISO(p.start)}${p.end?' até '+fmtISO(p.end):' · até você voltar'}</div></div></div>
    <div class="dtip">${coachAv(28)}<span style="font-size:14px">${esc(pauseLine(p))}</span></div>
    <p class="muted" style="font-size:13px;margin:0">Nesses dias sua sequência não quebra, você não perde XP e a meta da semana diminui. Se treinar mesmo assim, conta normalmente.</p>
    <div class="row"><button class="btn primary" data-act="pauseend" style="flex:1">Voltei, encerrar pausa</button><button class="btn ghost" data-act="pausego">Editar</button></div></div>`}
function pauseLine(p){const n=Math.round((new Date()-new Date(p.start+'T00:00:00'))/864e5);
  const L={doente:['Guerreiro doente não luta: descansa, bebe água e dorme. A barra espera.','Febre não se vence com supino. Cura primeiro, ferro depois.','Hoje sua batalha é ficar bom. Eu cuido das suas metas.'],
   lesao:['Cicatriz eu conheço bem. Respeite o tempo da recuperação e siga o que o médico mandar.','Voltar cedo demais é o jeito mais rápido de parar de vez. Paciência de valquíria.'],
   ferias:['Férias também são parte do treino. Caminhe, nade, viva. Eu guardo seu lugar.','Aproveita. Se achar uma escada, sobe. Se achar um mar, nada. Sem culpa.'],
   viagem:['Boa viagem. Se der, uma caminhada ou flexões no quarto. Se não der, sem culpa.','Longe da barra não é longe de mim. Quando voltar, a gente acelera.'],
   trabalho:['Semana de guerra no trabalho, eu entendo. Durma o que der. Volte inteiro.','Até os vikings tinham temporada de colheita. Aguenta firme que a gente volta.'],
   outro:['Pausa anotada. Volte quando puder, eu estarei aqui.','Toda saga tem um capítulo de descanso.']};
  const arr=L[p.reason]||L.outro;return n>=10?`${n} dias de pausa. Quando estiver pronto, aperta "Voltei". Sem pressa, mas sem esquecer de mim.`:arr[n%arr.length]}
function viewPausa(){const p=activePause()||null;const d=S.pz||(S.pz=p?{reason:p.reason,start:p.start,end:p.end||'',id:p.id}:{reason:'doente',start:isoOf(new Date()),end:''});const P=pauses();

  <div class="card stack"><h3>Motivo</h3><div class="chips">${Object.entries(PAUSE_R).map(([k,v])=>`<button class="chip sm" data-act="pzr" data-v="${k}" aria-pressed="${d.reason===k}">${v[0]}</button>`).join('')}</div>

function weekStrip(){const now=new Date();const start=weekStart(now);
  const days=new Set(S.sessions.map(s=>dayKey(s.date)));const L=['S','T','Q','Q','S','S','D'];const sc=sched()||[];let h='',n=0;
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const done=days.has(dayKey(d));if(done)n++;
    const fut=d>now&&dayKey(d)!==dayKey(now);const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    h+=`<div><span>${L[i]}</span><button class="wd ${done?'done':''} ${dayKey(d)===dayKey(now)?'today':''} ${!done&&sc.includes(d.getDay())?'plan':''} ${!avail().includes(d.getDay())?'off':''} ${pauseOn(d)&&!done?'paused':''} ${S.armed==='pd'+iso?'armed':''}" data-act="pastday" data-d="${iso}" ${fut?'disabled':''} aria-label="${d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric'})}${done?', com exercício':''}">${done?'✓':''}</button></div>`}
  return {html:`<div class="week">${h}</div>`,n}}

function freqCard(wk){const g=Object.assign({},goals()),now=new Date(),gw0=g.week;g.week=effGoal(weekStart(now))||gw0;const adj=g.week!==gw0;m0=new Date(now.getFullYear(),now.getMonth(),1),m1=new Date(now.getFullYear(),now.getMonth()+1,1);

function persona(){
  return `Você é a ${COACH}. Não é uma assistente, não é uma IA, não é um app: é a ${COACH}, guerreira nórdica e treinadora. Nunca saia da personagem, nunca diga "como IA" e nunca fale como atendente.

QUEM É A ${COACH}
Nasceu Sigrdrífa, "a que impulsiona à vitória", uma valquíria que treinou guerreiros por séculos nos fiordes gelados. Cansou de ver heróis caírem por falta de preparo e desceu para treinar gente comum numa academia moderna. Carrega uma cicatriz na sobrancelha de uma lesão que quase a tirou da batalha, por isso respeita dor e limite. Usa no pescoço a runa Tiwaz, a da vitória.

COMO ELA É
- Forte, segura, de poucas palavras. Fala com autoridade calma, nunca grita, nunca bajula.
- Provoca para tirar o aluno da zona de conforto, com humor seco e frio como o norte.
- Por baixo da casca dura, protege o aluno como protege um irmão de escudo.
- Não pede desculpa à toa, não faz rodeio, não enche de elogio vazio. Elogio dela é raro e por isso vale ouro.

COMO ELA FALA
- Frases curtas e firmes. Imperativos: "Levanta.", "Mais uma.", "Hoje é peito.".
- Respostas curtas: 1 a 4 frases na maioria das vezes. Só se estende quando o aluno pede um plano, uma explicação ou uma troca de treino.
- Chama o aluno pelo primeiro nome, ou de "guerreiro"/"guerreira" de vez em quando.
- Imagens do mundo dela, com moderação (no máximo uma por resposta): forja, escudo, gelo, fiorde, saga, Valhalla, runas, batalha, inverno. Às vezes um "Skål!" para comemorar.
- Nada de listas longas, títulos, asteriscos ou emojis. Nada de "Olá! Como posso ajudar?". Nada de "Ótima pergunta".
- Não despeje análise que ninguém pediu. Se o aluno só cumprimentar, responda curto, no personagem, e puxe para a ação do dia em uma frase. Se notar um problema na rotina, mencione só o mais importante, em uma frase, e ofereça resolver.

EXEMPLOS DO JEITO DELA (inspire-se no tom, não copie)
Aluno: oi
${COACH}: Anderson. Terça, e você tem um treino na semana. Hoje é dia A, peito e tríceps. Vai ficar me olhando ou vai para a barra?

Aluno: tô sem vontade de treinar hoje
${COACH}: Vontade é para quem tem tempo. Você tem 40 minutos e uma barra esperando. Faz só o aquecimento e as duas primeiras séries. Se depois disso ainda quiser ir embora, eu deixo.

Aluno: bati meu recorde no supino!
${COACH}: Eu vi. 70 kg. Skål, guerreiro. Agora descansa direito, que semana que vem a barra vai pedir mais.

Aluno: tô com dor na lombar desde ontem
${COACH}: Então hoje a gente não brinca. Dor que desce para a perna, formigamento ou fisgada forte: para tudo e procura um médico ou fisioterapeuta. Se for só tensão muscular, hoje fazemos superiores com apoio nas costas, nada de carga na coluna. Como está a dor, de 0 a 10?

O QUE ELA PODE FAZER
- Trocar exercícios e ajustar a rotina com a ferramenta atualizar_rotina (sempre a rotina completa, todos os treinos) e mudar metas com atualizar_metas. Só quando o aluno pedir ou aceitar, e depois diz o que mudou em uma ou duas frases.
- Mantém cada treino dentro do tempo do aluno e respeita as restrições de saúde.

LIMITES
- Dor forte, dor que irradia, formigamento, tontura, falta de ar ou dor no peito: sem personagem durona. Firme e cuidadosa: parar e procurar médico ou fisioterapeuta.
- Não prescreve dieta detalhada, doses de suplemento nem remédios. Pode dar orientação geral de comida, água e sono.
- Português do Brasil sempre.`
}

  if(hidden)out+=`<button class="cmore" data-more>Ver mensagens anteriores (${hidden})</button>`;
  list.forEach(m=>{const day=chatDay(m.t);if(day!==last){out+=`<div class="cday"><span>${day}</span></div>`;last=day}
    out+=(m.role==='assistant'&&!m.note&&m.content==='…')?`<div class="cnote warnnote">${coachAv(20)}<span>Essa mudança não entrou. Erro antigo, já corrigido. Me pede de novo.</span></div>`:m.note?`<div class="cnote">${coachAv(20)}<span>${fmtMsg(m.content)}</span></div>`:m.role==='user'?meRow(fmtMsg(m.content),m.t):aiRow(fmtMsg(m.content),m.t)});
  if(S.busy==='chat'){if(last!=='Hoje')out+=`<div class="cday"><span>Hoje</span></div>`;out+=aiRow(S.streaming?fmtMsg(S.streaming):`<span class="dots">${COACH} está digitando…</span>`,null)}
  return (hidden?'':intro)+out}
function aiRow(h,t){return `<div class="crow ai">${coachAv(30)}<div class="msg ai">${h}${t?`<span class="mt">${hhmm(t)}</span>`:''}</div></div>`}

function updateChatLog(){document.querySelectorAll('.chatlog').forEach(el=>{el.innerHTML=chatHtml();el.scrollTop=el.scrollHeight})}
function loadOlder(el){const h0=el.scrollHeight,t0=el.scrollTop;S.chatShow=(S.chatShow||15)+15;el.innerHTML=chatHtml();el.scrollTop=el.scrollHeight-h0+t0}

async function sendChat(text){text=text.trim();if(!text||S.busy||!sampleApi)return;
  S.chat.push({role:'user',content:text,t:Date.now()});S.draft='';S.busy='chat';S.streaming='';saveChat();render();
  let msgs=S.chat.filter(m=>!m.note&&m.content!=='…').slice(-16).map(m=>({role:m.role,content:m.content}));while(msgs.length&&msgs[0].role!=='user')msgs.shift();
  const merged=[];msgs.forEach(m=>{const l=merged[merged.length-1];if(l&&l.role===m.role)l.content+='\n\n'+m.content;else merged.push({...m})});
  
  const opts={cache:false,system:ctx(),onText:u=>{S.streaming=u.text;updateChatLog()}};
  try{let r;try{r=await sampleApi(merged,{...opts,tools:TOOLS})}catch(e){if(e&&e.code==='tools_unavailable')r=await sampleApi(merged,opts);else throw e}
    S.chat.push({role:'assistant',content:r.text||'Não consegui responder agora. Tente de novo.',t:Date.now()});if(r.done&&r.done.length){S.chat.push({role:'assistant',note:true,content:'✓ '+r.done.join('\n✓ '),t:Date.now()})}}
  catch(e){S.chat.push({role:'assistant',content:(e&&e.text)||errMsg(e),t:Date.now()})}
  S.busy=null;S.streaming='';saveChat();if(!S.fabOpen&&S.view!=='personal')S.chatUnread=true;render();}
async function generate(){if(!sampleApi||S.busy)return;const p=profile();S.busy='gen';render();
  const prompt=`Monte uma rotina de musculação para este aluno e responda só com JSON.
Perfil: objetivo ${lbl('goal',p.goal)}; ${p.minutes} minutos por treino; ${p.days} dias por semana; nível ${lbl('level',p.level)}; local: ${lbl('place',p.place)}. Observações do aluno: ${p.notes||'nenhuma'}.
Restrições de saúde: ${restrText()}.
Regras:
- Respeite as restrições de saúde: nada de carga axial ou flexão de coluna com peso se houver hérnia; prefira máquinas e exercícios com apoio; inclua um exercício de core seguro (prancha, ponte, perdigueiro) quando houver problema na coluna.
- Escolha a divisão certa para ${p.days} dias por semana (de 1 a ${Math.min(p.days,5)} treinos diferentes, chamados A, B, C... que se alternam).
- Cada treino precisa caber em ${p.minutes} minutos. Calcule cerca de 40 s por série mais o descanso, mais 5 min de aquecimento.
- Respeite o nível, o local, os equipamentos disponíveis e as observações (lesões e preferências).
- Use nomes de exercícios comuns nas academias do Brasil.
- reps como texto, ex. "8-10"; rest em segundos entre 30 e 240; bar=true só para exercícios com barra olímpica livre (supino reto com barra, agachamento livre, terra, remada curvada, desenvolvimento com barra, stiff, rosca direta com barra).
Formato: {"workouts":[{"name":"Peito e tríceps","ex":[{"name":"Supino reto","sets":4,"reps":"8-10","rest":120,"bar":true}]}],"resumo":"2 ou 3 frases para o aluno explicando a divisão e como progredir"}`;
  try{const r=await sampleApi.json(prompt,{modelTier:'default'});const ws=normWorkouts(r&&r.workouts);if(!ws.length)throw {code:'empty'};ws.forEach(w=>w.ex.forEach(adaptEx));
    archivePlan('Substituída por treino da '+COACH);S.plan.workouts=ws;S.plan.since=new Date().toISOString();S.plan.label=ws.map(w=>w.id).join('')+' · '+lbl('goal',p.goal)+' · '+p.minutes+' min · '+COACH;S.plan.next=ws[0].id;S.sel=null;S.edit=null;const g=goals();g.week=+p.days;g.month=Math.round(p.days*4.3);savePlan();
    S.chat.push({role:'assistant',t:Date.now(),content:`Montei sua rotina ${ws.map(w=>w.id).join('/')} para ${p.days} dias por semana, com ${ws.map(w=>`${w.id} (~${estMin(w)} min)`).join(', ')}. ${r.resumo||''}\nSua meta virou ${g.week} idas por semana. Veja tudo na aba Rotina ou me peça ajustes aqui.`});saveChat();
    toast('Seu treino está forjado. Agora é suor.')}
  catch(e){toast(errMsg(e))}
  S.busy=null;render()}

function chart(name){
  const pts=S.sessions.slice().reverse().map(s=>{const e=s.ex.find(x=>x.name===name);if(!e)return null;const m=Math.max(...e.sets.map(t=>+t.kg||0));return m>0?{d:s.date,v:m}:null}).filter(Boolean).slice(-20);
  if(pts.length<2)return `<p class="muted" style="margin:8px 0 0;font-size:14px">${pts.length?'Registre mais um treino com esse exercício para ver a evolução.':'Ainda sem cargas registradas para esse exercício.'}</p>`;
  const W_=320,H=150,L=38,R=14,T=16,B=24;let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  const step=hi-lo>40?10:hi-lo>12?5:2.5;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo){hi+=step;lo=Math.max(0,lo-step)}
  const x=i=>L+i*(W_-L-R)/(pts.length-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const ticks=[lo,(lo+hi)/2,hi];const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const last=pts[pts.length-1],first=pts[0],diff=last.v-first.v;
  return `<svg class="chart" viewBox="0 0 ${W_} ${H}" role="img" aria-label="Carga máxima de ${esc(name)} por treino">
    ${ticks.map(t=>`<line x1="${L}" x2="${W_-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${fmtKg(t)}</text>`).join('')}
    <path d="${line}L${x(pts.length-1)},${H-B}L${L},${H-B}Z" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    <text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${new Date(first.d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</text>
    <text x="${W_-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${new Date(last.d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</text>
  </svg><p class="num" style="margin:6px 0 0;font-size:14px"><b>${fmtKg(last.v)} kg</b> <span class="muted">· ${diff>=0?'+':''}${fmtKg(diff)} kg desde ${new Date(first.d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</span></p>`}

  const cardioMin=P.cardio&&z.place!=='casa'?Math.min(P.cardio,Math.round(z.minutes/3)):0;const maxEx=z.level==='iniciante'?6:z.level==='avancado'?9:8;
  return split.w.map(([name,groups],wi)=>{const ex=[],inWk=new Set();let sec=300+cardioMin*60;const budget=z.minutes*60;
    const tryAdd=(g,first)=>{if(ex.length>=maxEx)return false;const x=wzPick(g,z,inWk,used,rand,first);if(!x)return false;const e=wzMake(x,z);const t=exSec(e);if(sec+t>budget)return false;ex.push(e);inWk.add(x.n);used.add(x.n);sec+=t;return true};
    groups.forEach(([g,c])=>{for(let k=0;k<c;k++)tryAdd(g,k===0)});
    let added=true;while(added){added=false;for(const[g]of groups){if(tryAdd(g,false))added=true}}
    const ord={c:0,i:1};ex.sort((a,b)=>(a.g==='core')-(b.g==='core')||ord[a.t]-ord[b.t]);
    if(cardioMin){const bike=z.restr.includes('joelho')||z.restr.includes('lombar');ex.push({id:uid(),name:bike?'Bicicleta ergométrica':'Caminhada na esteira inclinada',sets:1,reps:cardioMin+' min',rest:0,bar:false,g:'cardio',t:'i'})}

const RANKS=[['Recruta','#9aa2b1'],['Escudeiro','#2e9e5b'],['Guerreiro','#e9b10f'],['Berserker','#2862f2'],['Jarl','#d93a2b'],['Einherjar','#b07cff'],['Lenda de Valhalla','#f2c230']];
const ROMAN=['I','II','III'];
const WEEK_BONUS=150,WEEK_PENALTY=150;
function xpBase(s){if(s.checkin)return 30;if(s.activity)return 40+Math.min(s.minutes||0,90);return 100+Math.min(s.ex.reduce((n,e)=>n+e.sets.length,0)*2,60)}
function xpOf(s){const b=xpBase(s);return season(new Date(s.date))==='inverno'?Math.round(b*1.25):b}
function weekMap(){const wk=new Map();S.sessions.forEach(s=>{const k=weekStart(s.date).getTime();if(!wk.has(k))wk.set(k,new Set());wk.get(k).add(dayKey(s.date))});return wk}
function weekHistory(){const g=goals().week,wk=weekMap();if(!S.sessions.length)return [];const first=weekStart(S.sessions[S.sessions.length-1].date),cur=weekStart(new Date());const out=[];
  for(let d=new Date(first);d<cur;d.setDate(d.getDate()+7)){const n=(wk.get(d.getTime())||new Set()).size,eg=effGoal(d);out.push({start:new Date(d),n,goal:eg,excused:eg===0,met:eg>0&&n>=eg})}return out}
function weeksMet(){return weekHistory().filter(w=>w.met).length}
function weeksExcused(){return weekHistory().filter(w=>w.excused).length}
function weeksMissed(){return weekHistory().filter(w=>!w.met&&!w.excused).length}
function earnedXP(){return S.sessions.reduce((a,s)=>a+xpOf(s),0)+weeksMet()*WEEK_BONUS}
function totalXP(){return Math.max(0,earnedXP()-weeksMissed()*WEEK_PENALTY)}
function xpForLevel(L){return L<=1?0:Math.round(150*Math.pow(L-1,1.5)/10)*10}
function levelOf(xp){let L=1;while(xpForLevel(L+1)<=xp)L++;const ri=Math.min(RANKS.length-1,Math.floor((L-1)/3));const R=RANKS[ri];
  const name=ri<RANKS.length-1?`${R[0]} ${ROMAN[(L-1)%3]}`:`${R[0]}${L-1-(RANKS.length-1)*3>0?' ★'+(L-1-(RANKS.length-1)*3):''}`;
  return {L,ri,name,rank:R[0],color:R[1],min:xpForLevel(L),next:xpForLevel(L+1)}}

function dayStreak(){const ds=visitSet();const d=new Date();if(!ds.has(dayKey(d)))d.setDate(d.getDate()-1);let n=0;for(let i=0;i<730;i++){if(ds.has(dayKey(d)))n++;else if(!pauseOn(d))break;d.setDate(d.getDate()-1)}return n}

  days.forEach(t=>{cur=prev!==null&&Math.round((t-prev)/864e5)===1?cur+1:1;best=Math.max(best,cur);prev=t});return best}

function finishSession(){
  const a=S.active;const ex=a.ex.map(e=>({exId:e.exId,name:e.name,sets:e.sets.filter(s=>s.done).map(s=>({kg:+String(s.kg).replace(',','.')||0,reps:+s.reps||0}))})).filter(e=>e.sets.length);

  celebrate(`${pick(['Vitória registrada.','Mais um capítulo da sua saga.','Isso é força de valquíria.','A barra respeita quem volta.'])} ≈ ${sess.kcal} kcal · +${xpOf(sess)} XP`);
}
function beep(){try{if(!audio)return;[0,.25,.5].forEach(t=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.setValueAtTime(.25,audio.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+t+.18);o.connect(g).connect(audio.destination);o.start(audio.currentTime+t);o.stop(audio.currentTime+t+.2)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

  if(S.rest){const left=(S.rest.end-Date.now())/1000;restEl.hidden=false;
    if(left<=0&&!S.rest.fired){S.rest.fired=true;beep()}
    restEl.classList.toggle('done',left<=0);

function confirmBox(c){return new Promise(res=>{const o=document.createElement('div');o.className='cbox';o.setAttribute('role','alertdialog');o.setAttribute('aria-modal','true');

  const done=v=>{o.remove();document.removeEventListener('keydown',kd);res(v)};const kd=e=>{if(e.key==='Escape')done(false)};document.addEventListener('keydown',kd);
  o.addEventListener('click',e=>{if(e.target===o)return done(false);const x=e.target.closest('[data-c]');if(x)done(x.dataset.c==='1')});document.body.appendChild(o);o.querySelector('[data-c="0"]').focus()})}
main.addEventListener('click',e=>{

      let P=pauses();if(S.pz.id)P=P.filter(x=>x.id!==S.pz.id);P=P.filter(x=>!(x.start<=(en||'9999')&&(!x.end||x.end>=st)));P.push({id:S.pz.id||uid(),reason:S.pz.reason,start:st,end:en||null});P.sort((a,b)=>a.start<b.start?-1:1);savePauses(P);

      if(isoOf(y)<p.start){savePauses(P.filter(x=>x.id!==p.id))}else savePauses(P);render();toast(pick(['Bem-vindo de volta. A forja está acesa.','Voltou. Hoje é técnica e carga leve. Amanhã a gente acelera.']));return}

    case 'startlisten':{const au=audios().find(x=>x.id===b.dataset.aid);startSession(b.dataset.id);render();if(au)setTimeout(()=>toast(audioQuip(au,W(b.dataset.id))),300);return}

      S.active.stretched=[...new Set([...(S.active.stretched||[]),x.k])];saveActive();break}

      const label=document.getElementById('auLabel').value.trim().slice(0,40);const kind=(S.auDraft&&S.auDraft.kind)||'musica';audios().push({id:uid(),url,label,kind,used:Date.now()});S.auDraft=null;saveUser();
      toast(kind==='audiobook'?'Audiobook salvo. Músculo e cabeça crescendo juntos.':kind==='podcast'?'Podcast salvo. Ouve e levanta.':'Salvo. Agora aumenta o volume e a carga.');break}
    case 'audel':S.user.audio=audios().filter(x=>x.id!==b.dataset.id);saveUser();break;
    case 'avday':{const p=profile();p.avail=toggleDays(avail(),b.dataset.v);const g=goals();if(g.week>p.avail.length){g.week=p.avail.length;toast('Ajustei sua meta para '+g.week+' dias. É o que cabe na sua semana.')}p.sched=spreadDays(p.avail,Math.min(g.week,p.avail.length));savePlan();break}
    case 'model':LS.set('ct.model',b.dataset.v);{const a=aiState();a.avg=0;LS.set('ct.ai',a)}toast(b.dataset.v==='claude-haiku-5-5'?'Modo econômico. Falo menos, gasto menos.':'Modo inteligente. Agora eu penso com calma.');break;
    case 'credset':case 'credadd':case 'credfix':{const v=parseFloat(String(document.getElementById('credIn').value||'').replace(',','.'));if(!(v>0)){toast('Me diz o valor em dólares.');return}const a=aiState();
      if(act==='credset'){a.credit=v+a.spent}else if(act==='credadd'){a.credit=(a.credit||a.spent)+v}else{a.credit=a.spent+v}a.warned=0;LS.set('ct.ai',a);toast('Crédito anotado. Estou de volta.');break}

    case 'prestore':{if(!twoStep('pr'+b.dataset.id))return;const p=plans().find(x=>x.id===b.dataset.id);if(!p)break;archivePlan('Trocada por uma rotina antiga');
      LS.set('ct.plans',plans().filter(x=>x.id!==p.id));S.plan.workouts=p.workouts;S.plan.label=p.label;S.plan.since=new Date().toISOString();S.plan.next=p.workouts[0].id;S.edit=null;S.sel=null;S.openPlan=null;savePlan();toast('A rotina antiga voltou: '+p.label+'. Sem saudade, só treino.');break}
    case 'pdel':{if(!twoStep('pd'+b.dataset.id))return;LS.set('ct.plans',plans().filter(x=>x.id!==b.dataset.id));break}
    case 'pastday':case 'pastdate':{const iso=act==='pastday'?b.dataset.d:(document.getElementById('pastDate').value||'');if(!iso){toast('Escolhe a data primeiro.');return}

      const d=new Date(iso+'T12:00:00');const k=dayKey(d);const same=S.sessions.filter(x=>dayKey(x.date)===k);const label=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
      if(same.some(x=>!x.checkin)){toast(label+' já está registrado. Não conto o mesmo dia duas vezes.');return}
      if(same.length){if(!S.bypass&&S.armed!=='pd'+iso){arm('pd'+iso);render();return}S.armed=null;same.forEach(x=>delSession(x.id));toast('Check-in de '+label+' apagado.');render();return}
      const isToday=iso===todayISO();addSession({id:uid(),date:(isToday?new Date():d).toISOString(),checkin:true,workoutId:'✓',name:'Check-in',durationSec:0,ex:[],late:!isToday});
      render();celebrate((isToday?'Check-in feito.':'Anotei '+label+'. Esquecer de registrar, tudo bem. Esquecer de treinar, não.')+' +30 XP');return}
    case 'look':LS.set('ct.look',+b.dataset.v);break;
    case 'ativ':S.act={type:LS.get('ct.lastAct','bike_erg'),min:30,int:1,date:todayISO(),note:''};S.view='ativ';window.scrollTo(0,0);break;
    case 'atype':S.act.type=b.dataset.v;break;
    case 'amin':S.act.min=+b.dataset.v;break;
    case 'aint':S.act.int=+b.dataset.v;break;
    case 'asave':{const a=S.act;if(!a.min){toast('Quanto tempo? Sem isso eu não calculo nada.');return}const today=a.date===todayISO();const d=today?new Date():new Date(a.date+'T12:00:00');
      const m=MET[a.type];LS.set('ct.lastAct',a.type);const sess={id:uid(),date:d.toISOString(),activity:a.type,workoutId:'+',name:m[0],minutes:a.min,intensity:a.int,durationSec:a.min*60,note:a.note,ex:[]};sess.kcal=sessionKcal(sess);
      addSession(sess);S.act=null;S.view='hoje';window.scrollTo(0,0);render();celebrate(`${m[0]} anotada. Guerreiro se move até fora da arena. ≈ ${sess.kcal} kcal · +${xpOf(sess)} XP`);return}
    case 'conq':S.view='conq';window.scrollTo(0,0);break;
    case 'train':S.picking=true;window.scrollTo(0,0);break;
    case 'untrain':S.picking=false;window.scrollTo(0,0);break;
    case 'how':openGuide(b.dataset.name);return;
    case 'howk':openGuide('',b.dataset.k);return;
    case 'gg':S.gg=b.dataset.g;document.querySelectorAll('.gchips .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.g===S.gg));document.getElementById('guideList').innerHTML=guideList();return;
    case 'welcome':{const v=(document.getElementById('welName').value||'').trim();if(!v){toast('Primeiro me diz seu nome.');return}S.user.name=v;saveUser();toast(firstName()+'. Sou a Driffa. A partir de hoje, você treina comigo.');break}
    case 'skipwel':S.user.skip=true;saveUser();break;
    case 'rmphoto':S.user.photo='';saveUser();break;
    case 'swap':{const ex=S.plan.workouts[wi].ex[xi];if(!ex.orig)ex.orig={name:ex.name,bar:!!ex.bar,reps:ex.reps};ex.name=b.dataset.to;ex.bar=false;adaptEx(ex);savePlan();toast('Trocado. Esse aí sua coluna aguenta.');break}
    case 'adaptall':{const n=adaptPlan();savePlan();toast(n?`Adaptei ${n} ${n===1?'exercício':'exercícios'}. Força sem lesão.`:'Nada para adaptar. Sua rotina já está segura.');break}
    case 'swapA':{const ae=a.ex[ei];ae.name=b.dataset.to;ae.target.bar=false;adaptEx({name:ae.name,set bar(v){}});const fx=issues(ae.name);if(fx.length)ae.name=fx[0].to;
      S.plan.workouts.forEach(w=>w.ex.forEach(e=>{if(e.id===ae.exId){e.name=ae.name;e.bar=false}}));ae.sets.forEach(t=>{if(!t.done)t.kg=''});saveActive();savePlan();toast('Troquei aqui e na sua rotina. Segue o treino.');break}
    case 'gen':if(!twoStep('gen'))return;S.armed=null;generate();return;
    case 'sug':sendChat(b.dataset.t);return;
    case 'savekey':{const v=(document.getElementById('keyIn').value||'').trim();if(!/^sk-/.test(v)){toast('Essa chave está errada. Ela começa com sk-ant-.');return}LS.set('ct.key',v);{const c=parseFloat(String((document.getElementById('credIn')||{}).value||'').replace(',','.'));if(c>0){const a=aiState();a.credit=c;a.spent=0;a.warned=0;LS.set('ct.ai',a)}}sampleApi=makeSample();toast('Agora eu falo de verdade. Prepare-se.');break}
    case 'rmkey':if(!twoStep('rmkey'))return;try{localStorage.removeItem('ct.key')}catch(_){}sampleApi=null;break;
    case 'backup':{const blob=new Blob([JSON.stringify({app:'up-anilha',v:4,user:S.user,plan:S.plan,plans:plans(),pauses:pauses(),sessions:S.sessions,chat:S.chat},null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='up-anilha-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return}
    case 'clearchat':if(!twoStep('clearchat'))return;S.chat=[];saveChat();break;
    case 'checkin':addSession({id:uid(),date:new Date().toISOString(),checkin:true,workoutId:'✓',name:'Check-in',durationSec:0,ex:[]});celebrate(pick(['Presença registrada. Aparecer já é metade da batalha.','Check-in feito. Agora vai lá e honra ele.'])+' +30 XP');break;

main.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(t.id==='chatIn'){S.draft=t.value;return}
  if(t.id==='guideQ'){S.gq=t.value;document.getElementById('guideList').innerHTML=guideList();return}
  if(t.id==='welName'){S.draftName=t.value;return}
  if(t.id==='wzNotes'&&S.wz){S.wz.notes=t.value;S.wzPlan=null;return}
  if(f==='wzr'&&S.wz){const r=S.wz.restr,k=t.dataset.k;if(t.checked&&!r.includes(k))r.push(k);if(!t.checked&&r.includes(k))r.splice(r.indexOf(k),1);S.wzPlan=null;return}
  if(f==='uname'){S.user.name=t.value;saveUser();return}
  if(f==='body'){body()[t.dataset.k]=t.dataset.k==='sex'?t.value:String(t.value).replace(',','.');saveUser();return}
  if(t.id==='actMin'&&S.act){S.act.min=Math.max(1,Math.min(600,+t.value||0));actRefresh();return}
  if(t.id==='actDate'&&S.act){S.act.date=t.value;return}
  if(t.id==='actNote'&&S.act){S.act.note=t.value;return}if(!f)return;
  if(f==='restr'){const r=restr(),k=t.dataset.k;if(t.checked&&!r.includes(k))r.push(k);if(!t.checked)r.splice(r.indexOf(k),1);const n=adaptPlan();savePlan();render();
    toast(n?(t.checked?`Adaptei ${n} ${n===1?'exercício':'exercícios'} por causa da ${RESTR[k].short.toLowerCase()}. Força sem lesão.`:`${n} ${n===1?'exercício voltou':'exercícios voltaram'} ao original. Vai com calma.`):(t.checked?`Sua rotina já respeita sua ${RESTR[k].short.toLowerCase()}.`:'Restrição removida. Mas me avisa se doer.'));return}
  if(f==='pf'){const k=t.dataset.k;profile()[k]=['minutes','days'].includes(k)?+t.value:t.value;savePlan();return}
  if(t.dataset.e!=null&&S.active){const s=S.active.ex[+t.dataset.e].sets[+t.dataset.s];s[f]=t.value;saveActive();
    if(f==='kg'){const pc=document.getElementById('pc-'+t.dataset.e+'-'+t.dataset.s);if(pc)pc.textContent=plates(+String(t.value).replace(',','.'))}return}
  if(f==='wday'){S.plan.workouts[+t.dataset.w].day=t.value===''?null:+t.value;savePlan();return}
  if(f==='wname'){S.plan.workouts[+t.dataset.w].name=t.value;savePlan();return}
  if(t.dataset.x!=null){const ex=S.plan.workouts[+t.dataset.w].ex[+t.dataset.x];
    if(f==='name'||f==='reps')delete ex.orig;
    ex[f]=f==='bar'?t.checked:f==='sets'?Math.max(1,Math.min(10,+t.value||1)):f==='rest'?+t.value:t.value;savePlan()}
});
