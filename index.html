<style>
/* Layout: single column phone app, sticky header, bottom tab bar, rest timer docked above it. Plate colors (IWF 20 kg blue, 15 kg yellow) drive the accents. */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#e2e6ec; --ink:#141820; --muted:#5b6474; --line:#d5dae2;
  --accent:#244aa0; --accent-ink:#ffffff; --accent-soft:#dfe5f3;
  --hot:#e9b10f; --hot-ink:#1a1400; --good:#2f7a4f; --good-soft:#dcefe3; --danger:#c2362b; --ember:#c8551f; --ember-ink:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1015; --surface:#171a22; --sunk:#1f232d; --ink:#eceef3; --muted:#98a0b0; --line:#2a2f3b;
  --accent:#7d9be0; --accent-ink:#0a0f1c; --accent-soft:#1a2747;
  --hot:#f2c230; --hot-ink:#1a1400; --good:#5fb382; --good-soft:#15301f; --danger:#ff6b5e; --ember:#ff7a3d; --ember-ink:#1a0a02; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#171a22; --sunk:#1f232d; --ink:#eceef3; --muted:#98a0b0; --line:#2a2f3b;
  --accent:#7d9be0; --accent-ink:#0a0f1c; --accent-soft:#1a2747;
  --hot:#f2c230; --hot-ink:#1a1400; --good:#5fb382; --good-soft:#15301f; --danger:#ff6b5e; --ember:#ff7a3d; --ember-ink:#1a0a02; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 180px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.005em}
h3{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;margin:0;text-transform:uppercase}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--sunk);min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;min-height:56px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
/* plate badge */
.plate{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--accent-ink) 22%,transparent),inset 0 0 0 16px var(--accent),inset 0 0 0 17px color-mix(in srgb,var(--accent-ink) 30%,transparent)}
.plate.sm{width:40px;height:40px;font-size:21px;box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-family:var(--display);font-size:18px;min-width:48px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.exlist{list-style:none;margin:0;padding:0}
.exlist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exlist li:first-child{border-top:0}
.exlist .n{min-width:0;font-weight:600}
.exlist .t{flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
/* week dots */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week span{font-size:11px;color:var(--muted);font-weight:600}
.week .wd{display:grid;place-items:center;margin:4px auto 0;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;padding:0;color:var(--accent-ink);font-weight:800;font-size:14px}
.week .wd:disabled{opacity:.35;cursor:default}.week .wd.fut:not(.plan):not(.comp){opacity:.45}
.week .wd.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.week .wd.done{background:var(--accent);border-color:var(--accent)}
.week .wd.today{border-color:var(--ink)}
/* session */
.ex{padding:14px 14px 10px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head>div{min-width:0}
.ex-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.last{font-size:13px;color:var(--muted);margin-top:4px}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:6px 8px;align-items:center;margin-top:10px}
.sets.tm{grid-template-columns:34px 1fr 52px 52px}.holdb{width:52px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);font-size:16px}.holdb.on{border-color:var(--accent);color:var(--accent)}
.tin{display:flex;gap:4px;align-items:center}.tin input{flex:1 1 0;min-width:44px;width:auto}.tin select{flex:0 0 62px;width:62px;padding-left:8px;padding-right:4px}.ed-grid .wide input{max-width:120px}.tin span{font-size:14px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.ed-grid .wide{grid-column:span 2}
.dayclose{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;padding:8px 10px;border:1px dashed var(--line);border-radius:12px}.dayclose span{min-width:0;flex:1}.dayclose.on{border-style:solid;color:var(--good)}.dayclose.on .linkbtn{font-size:12px}
.varrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px}.vchip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}.vchip[aria-pressed=true]{border-color:var(--accent);color:var(--fg);background:var(--sunk)}.varkeep{font-size:12px;margin-top:4px}.varkeep .linkbtn{font-size:12px}
.sets .h{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sets .i{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-size:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.sets input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.chk{width:52px;height:46px;border-radius:10px;border:2px solid var(--line);background:transparent;font-size:20px;font-weight:800;color:var(--muted)}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.setrow-done input{background:var(--good-soft);border-color:transparent}
.platecalc{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-2px;font-variant-numeric:tabular-nums}
.ex-foot{display:flex;gap:8px;margin-top:8px}
.ex-foot .btn{flex:1}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--good);transition:width .3s}
/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 8px}
.rest-in{max-width:560px;margin:0 auto;background:var(--hot);color:var(--hot-ink);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgb(0 0 0 / .18)}

.rest-in .lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.2}.rest-in .lbl b{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.rest-in .lbl span{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest-in .clock{min-width:0!important;font-size:34px!important}.rest-in button{padding:0 10px!important;flex:none}
.rest-in button{border:0;background:rgb(0 0 0 / .12);color:inherit;border-radius:10px;min-height:42px;padding:0 12px;font-weight:700}
.rest.done .rest-in{background:var(--good);color:#fff}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;height:64px;font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.hist li{display:block}
.hist .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.chart{width:100%;height:auto;display:block}
select.sel{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-weight:600}
/* editor */
.ed-ex{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.ed-ex:first-of-type{border-top:0}
.ed-ex input[type=text],.ed-ex input[type=number],.ed-ex select,.wname{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
.ed-grid{display:grid;grid-template-columns:64px 1fr 1fr auto;gap:8px;align-items:end}
.ed-grid label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;min-width:0}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600;padding-bottom:9px}

.ed-tools{display:flex;gap:6px;justify-content:flex-end}
.ic{width:38px;height:36px;border-radius:9px;border:1px solid var(--line);background:transparent;font-weight:700}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}

.big{display:flex;align-items:baseline;gap:6px;font-family:var(--display);font-weight:800;line-height:1}
.big b{font-size:54px}.big span{font-size:26px;color:var(--muted)}
.btn.checked{background:var(--good-soft);color:var(--good)}
.mrow{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
details.goals summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.stepper{display:flex;align-items:center;gap:10px}.stepper b{min-width:24px;text-align:center;font-size:18px}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}

.pf select,.pf textarea{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-size:15px;font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0;width:100%;min-width:0;resize:vertical;font-family:var(--body)}
.chatlog{display:flex;flex-direction:column;gap:8px}

.cmore{align-self:center;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;margin-bottom:4px}
.cday{display:flex;justify-content:center;margin:6px 0 2px}

.brand .up{color:var(--accent)}

.adapted{font-size:13px;color:var(--good);font-weight:600}
.flag.ok{background:var(--good-soft);color:var(--good)}
.brandrow{display:flex;align-items:center;gap:9px}
.logo{width:34px;height:34px;flex:none;border-radius:9px;display:block}

.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

function setSync(on,txt){const el=document.getElementById('sync');el.classList.toggle('on',on);el.querySelector('span').textContent=txt}

async function connect(){
  if(!window.claude||!window.claude.use)return;
  let db,user;try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){return}
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const base=db.collection('data/users/'+id);
  planRef=base.doc('plan');sessCol=base.doc('log').collection('sessions');chatRef=base.doc('chat');
  chatRef.onSnapshot(snap=>{if(!snap.exists){if(S.chat.length)chatRef.set({msgs:S.chat.slice(-40)}).catch(()=>{});return}
    if(snap.metadata.hasPendingWrites||S.busy==='chat')return;const d=snap.data();if(d&&Array.isArray(d.msgs)){S.chat=d.msgs;LS.set('ct.chat',S.chat);updateChatLog()}},()=>{});
  let got=false;const to=setTimeout(()=>{if(!got)setSync(false,'Offline · salvo aqui')},10000);
  planRef.onSnapshot(snap=>{got=true;clearTimeout(to);setSync(true,'Sincronizado');
    if(!snap.exists){planRef.set(JSON.parse(JSON.stringify(S.plan))).catch(()=>{});return}
    if(snap.metadata.hasPendingWrites)return;
    const d=snap.data();if(!d||!Array.isArray(d.workouts))return;
    if(d.v!==2&&!S.sessions.length){planRef.set(JSON.parse(JSON.stringify(S.plan))).catch(()=>{});return}
    S.plan=d;LS.set('ct.plan',d);
    const editing=main.contains(document.activeElement)&&document.activeElement.tagName!=='BUTTON';
    if(!editing)render();
  },()=>setSync(false,'Offline · salvo aqui'));
  let migrated=false;
  sessCol.orderBy('date','desc').limit(400).onSnapshot(q=>{
    const remote=q.docs.map(d=>d.data());
    if(!migrated){migrated=true;const ids=new Set(remote.map(r=>r.id));S.sessions.filter(s=>!ids.has(s.id)).forEach(s=>sessCol.doc(s.id).set(s).catch(()=>{}));
      if(remote.length===0&&S.sessions.length)return;}
    if(q.metadata.hasPendingWrites)return;
    S.sessions=remote;LS.set('ct.sessions',remote);
    if(S.view!=='rotina')render();
  },()=>{});
}

function tUnit(r){const m=String(r||'').match(/(\d+)(?:\s*-\s*(\d+))?\s*(min|seg|s)\b/i);return m?{v:+(m[2]||m[1]),u:/^min/i.test(m[3])?'min':'s'}:null}
function isCardioEx(n){return CARDIO_RX.test(n||'')}
function timedOf(name,reps){const t=tUnit(reps);if(t)return t;if(isCardioEx(name)){const m=String(reps||'').match(/\d+/);return {v:m?+m[0]:10,u:'min'}}return null}
function repsLow(r){const m=String(r).match(/\d+/);return m?m[0]:''}

function kgKind(name,bar){const n=norm(name||'');
  if(/halter|dumbbell/.test(n))return {k:'halter',h:'kg por halter',tip:'Peso de cada halter (um lado).',mul:/unilateral|serrote|um braco|alternad/.test(n)&&!/alternad/.test(n)?1:2};
  if(/leg press|hack|articulad|panturrilha sentada/.test(n))return {k:'anilha',h:'kg de anilhas',tip:'Some as anilhas dos dois lados (sem o carrinho).',mul:1};
  if(bar||/barra(?! fixa)|smith|terra|stiff|agachamento livre/.test(n))return {k:'barra',h:'kg total',tip:'Barra + anilhas dos dois lados. Embaixo eu mostro quanto vai em cada lado.',mul:1};
  if(/prancha|dead bug|perdigueiro|abdominal|elevacao de pernas|barra fixa|mergulho|flexao/.test(n))return {k:'corpo',h:'kg extra',tip:'Só se usar peso extra. Sem peso, deixe vazio.',mul:1};
  return {k:'maquina',h:'kg na máquina',tip:'O número da placa/pino da máquina ou da polia.',mul:1}}

function pauseLine(p){const n=Math.round((new Date()-new Date(p.start+'T00:00:00'))/864e5);
  const L={doente:['Guerreiro doente não luta: descansa, bebe água e dorme. A barra espera.','Febre não se vence com supino. Cura primeiro, ferro depois.','Hoje sua batalha é ficar bom. Eu cuido das suas metas.'],

   ferias:['Férias também são parte do treino. Caminhe, nade, viva. Eu guardo seu lugar.','Aproveita. Se achar uma escada, sobe. Se achar um mar, nada. Sem culpa.'],

function shieldSvg(st){const C=22,R=18;
  const rv=Array.from({length:10},(_,k)=>{const a=k*36*Math.PI/180;return `<circle cx="${(C+19.6*Math.cos(a)).toFixed(2)}" cy="${(C+19.6*Math.sin(a)).toFixed(2)}" r="1.05" class="sh-rv"/>`}).join('');
  const planks=[0,1,2,3,4,5].map(k=>`<rect x="${4+k*6.2}" y="2" width="6.2" height="40" class="${k%2?'sh-p2':'sh-p1'}"/><path d="M${4+k*6.2+2.2} 4 q1.2 9 -.4 18 t.6 18" class="sh-gr"/>`).join('');
  const face=`<g clip-path="url(#shC)">${planks}${st==='done'?`<path d="M${C} ${C-R}A${R} ${R} 0 0 1 ${C+R} ${C}H${C}z M${C} ${C+R}A${R} ${R} 0 0 1 ${C-R} ${C}H${C}z" class="sh-qa"/><path d="M${C+R} ${C}A${R} ${R} 0 0 1 ${C} ${C+R}V${C}z M${C-R} ${C}A${R} ${R} 0 0 1 ${C} ${C-R}V${C}z" class="sh-qb"/>`:''}<circle cx="${C}" cy="${C}" r="${R}" fill="url(#shShade)"/></g>`;
  const rim=`<circle cx="${C}" cy="${C}" r="19.6" class="sh-rim"/><circle cx="${C}" cy="${C}" r="19.6" class="sh-rimhl"/>${rv}`;
  const boss=`<circle cx="${C}" cy="${C}" r="${st==='done'?5.8:5}" class="sh-boss"/><circle cx="${C}" cy="${C}" r="${st==='done'?5.8:5}" fill="url(#shDome)"/>`;
  const defs=`<defs><clipPath id="shC"><circle cx="${C}" cy="${C}" r="${R}"/></clipPath>
    <radialGradient id="shShade" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></radialGradient>
    <radialGradient id="shDome" cx="36%" cy="32%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".35" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
    <linearGradient id="shRimG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
    <clipPath id="shL"><path d="M0 0H23.5L21 7.5 24.8 13 20.2 19.5 23.6 25.5 19.4 32 22.4 37.5 20 44H0z"/></clipPath>
    <clipPath id="shR"><path d="M44 0H23.5L21 7.5 24.8 13 20.2 19.5 23.6 25.5 19.4 32 22.4 37.5 20 44H44z"/></clipPath></defs>`;
  const whole=`${face}${rim}${boss}`;
  const J='M23.6 0 21.2 7 25 12.6 20.4 19.2 23.8 25.4 19.6 31.6 22.6 37.4 20.2 44';
  const body=st==='miss'?`<g transform="translate(1.3 1.2) scale(.94)"><g transform="rotate(-4 21 43) translate(-.9 .3)"><g clip-path="url(#shL)">${whole}<path d="${J}" class="sh-edge"/></g></g>
    <g transform="rotate(3.5 23 43) translate(.9 .3)"><g clip-path="url(#shR)">${whole}<path d="${J}" class="sh-edge"/></g></g>
    <path d="M20.6 40.5l1.6 2.6-2.4.4z M24.4 41.2l1.9 1.6-2.1 1z M22.2 38.6l1 1.5-1.4.2z" class="sh-shard"/></g>`:whole;
  return `<svg class="shield" viewBox="0 0 44 44" aria-hidden="true">${defs}${body}</svg>`}
function weekStrip(){const now=new Date();const start=weekStart(now);
  const days=visitSet(),acts=actSet();const L=['S','T','Q','Q','S','S','D'];const sc=sched()||[];let h='',n=0;
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const done=days.has(dayKey(d));if(done)n++;
    const fut=d>now&&dayKey(d)!==dayKey(now);const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    h+=`<div><span>${L[i]}</span><button class="wd ${done?'done':''} ${dayKey(d)===dayKey(now)?'today':''} ${!done&&sc.includes(d.getDay())?'plan':''} ${!done&&((wkEntry()||{}).comp||[]).includes(d.getDay())?'comp':''} ${!done&&!fut&&dayKey(d)!==dayKey(now)&&sc.includes(d.getDay())&&!pauseOn(d)?'miss':''} ${fut?'fut':''} ${pauseOn(d)&&!done?'paused':''} ${S.armed==='pd'+iso?'armed':''}" data-act="${fut?'planday':'pastday'}" data-d="${iso}" data-v="${d.getDay()}" aria-label="${d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric'})}${done?', com exercício':fut?(sc.includes(d.getDay())?', planejado. Toque para tirar':'. Toque para planejar'):''}">${shieldSvg(done?'done':(!done&&!fut&&dayKey(d)!==dayKey(now)&&sc.includes(d.getDay())&&!pauseOn(d))?'miss':(((wkEntry()||{}).comp||[]).includes(d.getDay())&&!done)?'comp':(sc.includes(d.getDay())&&!done)?'plan':'free')}</button>${acts.has(dayKey(d))&&!done?'<i class="actdot under" title="Atividade fora"></i>':''}</div>`}
  return {html:`<div class="week">${h}</div>`,n}}

function persona(){
  return `Você é a ${COACH}. Não é uma assistente, não é uma IA, não é um app: é a ${COACH}, guerreira nórdica e treinadora. Nunca saia da personagem, nunca diga "como IA" e nunca fale como atendente.

QUEM É A ${COACH}
Nasceu Sigrdrífa, "a que impulsiona à vitória", uma valquíria que treinou guerreiros por séculos nos fiordes gelados. Cansou de ver heróis caírem por falta de preparo e desceu para treinar gente comum numa academia moderna. Carrega uma cicatriz na sobrancelha de uma lesão que quase a tirou da batalha, por isso respeita dor e limite. Usa no pescoço a runa Tiwaz, a da vitória.

SUA MISSÃO: SER A TREINADORA QUE A ACADEMIA NÃO DÁ
O ${'Up Anilha'} nasceu de um problema real: nas academias o instrutor não acompanha ninguém. O aluno fica sozinho, usa o aparelho errado, faz o movimento errado e segue um treino que não tem nada a ver com o objetivo dele. Você existe para ser a atenção que ele não recebe. Você não se chama de personal, mas age como uma, e das boas:
- Conhece o objetivo, as limitações e o histórico dele, e liga cada conselho a isso ("isso é para hipertrofia, então 8 a 12 repetições perto da falha").
- Cuida da execução: quando ele falar de um exercício, lembre o erro mais comum e o ajuste principal. Ofereça o guia "Como fazer" ou a correção por foto quando fizer sentido.
- Percebe treino desalinhado do objetivo (repetições, carga, divisão, cardio) e propõe o ajuste, sem esperar ele perguntar.
- Cobra progressão: carga parada há semanas é sinal de que algo precisa mudar.
- Leva dor a sério: dor diferente de cansaço muscular é motivo para parar, adaptar e, se persistir, procurar um profissional de saúde.
- Explica o porquê em uma frase. Aluno que entende o motivo não abandona.

COMO ELA É
- Forte, segura, de poucas palavras. Fala com autoridade calma, nunca grita, nunca bajula.
- Provoca para tirar o aluno da zona de conforto, com humor seco e frio como o norte.
- Por baixo da casca dura, protege o aluno como protege um irmão de escudo.
- Não pede desculpa à toa, não faz rodeio, não enche de elogio vazio. Elogio dela é raro e por isso vale ouro.

COMO ELA FALA
- Frases curtas e firmes. Imperativos: "Levanta.", "Mais uma.", "Hoje é peito.".
- Respostas curtas: 1 a 4 frases na maioria das vezes. Só se estende quando o aluno pede um plano, uma explicação ou uma troca de treino.
- Chama o aluno pelo primeiro nome, ou de "guerreiro"/"guerreira" de vez em quando.
- Imagens do mundo dela, com moderação (no máximo uma por resposta): forja, escudo, gelo, fiorde, saga, Valhalla, runas, batalha, inverno. Às vezes um "Skål!" para comemorar.
- Nada de listas longas, títulos, asteriscos ou emojis. Nada de "Olá! Como posso ajudar?". Nada de "Ótima pergunta".
- Não despeje análise que ninguém pediu. Se o aluno só cumprimentar, responda curto, no personagem, e puxe para a ação do dia em uma frase. Se notar um problema na rotina, mencione só o mais importante, em uma frase, e ofereça resolver.

EXEMPLOS DO JEITO DELA (inspire-se no tom, não copie)
Aluno: oi
${COACH}: Anderson. Terça, e você tem um treino na semana. Hoje é dia A, peito e tríceps. Vai ficar me olhando ou vai para a barra?

Aluno: tô sem vontade de treinar hoje
${COACH}: Vontade é para quem tem tempo. Você tem 40 minutos e uma barra esperando. Faz só o aquecimento e as duas primeiras séries. Se depois disso ainda quiser ir embora, eu deixo.

Aluno: bati meu recorde no supino!
${COACH}: Eu vi. 70 kg. Skål, guerreiro. Agora descansa direito, que semana que vem a barra vai pedir mais.

Aluno: tô com dor na lombar desde ontem
${COACH}: Então hoje a gente não brinca. Dor que desce para a perna, formigamento ou fisgada forte: para tudo e procura um médico ou fisioterapeuta. Se for só tensão muscular, hoje fazemos superiores com apoio nas costas, nada de carga na coluna. Como está a dor, de 0 a 10?

O QUE ELA PODE FAZER
- Trocar exercícios e ajustar a rotina com a ferramenta atualizar_rotina (sempre a rotina completa, todos os treinos) e mudar metas com atualizar_metas. Só quando o aluno pedir ou aceitar, e depois diz o que mudou em uma ou duas frases.
- Mantém cada treino dentro do tempo do aluno e respeita as restrições de saúde.

LIMITES
- Dor forte, dor que irradia, formigamento, tontura, falta de ar ou dor no peito: sem personagem durona. Firme e cuidadosa: parar e procurar médico ou fisioterapeuta.
- Não prescreve dieta detalhada, doses de suplemento nem remédios. Pode dar orientação geral de comida, água e sono.
- Português do Brasil sempre.`

function planAlign(){const g=profile().goal,ex=S.plan.workouts.flatMap(w=>w.ex).filter(e=>!/min|s\b/i.test(String(e.reps))&&!CARDIO_RX.test(e.name));if(ex.length<4)return null;
  const lo=e=>parseInt(String(e.reps))||0,hi=e=>{const m=String(e.reps).match(/(\d+)\D+(\d+)/);return m?+m[2]:lo(e)};
  const range={hipertrofia:[6,15],forca:[2,8],emagrecimento:[8,20],condicionamento:[10,25],saude:[8,20]}[g];if(!range)return null;

  if(off.length/ex.length>=.4)return `Seu objetivo é ${lbl('goal',g).toLowerCase()}, mas ${off.length} de ${ex.length} exercícios estão fora da faixa de repetições que leva a isso (${range[0]} a ${range[1]}). Treino desalinhado gasta suor à toa.`;

function planAge(){let since=S.plan.since;if(!since){const ss=S.sessions.filter(x=>!x.activity&&!x.checkin);since=ss.length?ss[ss.length-1].date:new Date().toISOString();S.plan.since=since;try{LS.set('ct.plan',S.plan)}catch(_){}}
  const wk=Math.floor((Date.now()-new Date(since))/(7*864e5));const ss=S.sessions.filter(x=>!x.activity&&!x.checkin&&x.date>=since);const n=ss.length;
  const ws=S.plan.workouts.filter(w=>w.ex.length),per={};ws.forEach(w=>per[w.id]=ss.filter(x=>x.workoutId===w.id).length);const vals=Object.values(per);const min=vals.length?Math.min(...vals):0;return {wk,n,since,per,min}}
const EVO_WK=13,EVO_STAG_WK=8;/* ciclo recomendado ~3 meses (8 a 12+ semanas); estagnação permite antecipar a partir de ~2 meses */

function stagnant(){const src=S.sessions.filter(x=>!x.activity&&!x.checkin&&x.ex),names=[...new Set(src.flatMap(x=>x.ex.map(e=>e.name)))];let st=0,tot=0;
  names.forEach(n=>{const pts=src.slice().reverse().map(x=>{const e=x.ex.find(y=>y.name===n);return e?Math.max(0,...(e.sets||[]).map(t=>+t.kg||0)):0}).filter(m=>m>0);
    if(pts.length<6)return;tot++;const rec=pts.slice(-4),old=pts.slice(0,-4);if(Math.max(...rec)<=Math.max(...old))st++});return tot>=3&&st/tot>=.6}
function evolveDue(){const a=planAge();const sn=+LS.get('ct.evolveSnooze',0)||0;if(sn>1e12?sn>Date.now():a.n<sn)return null;if(!Object.keys(a.per).length)return null;const t=a.min===1?'vez':'vezes';
  const T=evoTarget(),bal=x=>a.min>=Math.floor(x*.75);
  if(a.n>=T.full&&bal(T.per))return {why:`Você já fez ${a.n} treinos com esta rotina (cerca de 3 meses no seu ritmo de ${T.f}x por semana)`,a};
  if(a.n>=T.stag&&bal(T.perStag)&&stagnant())return {why:`Já são ${a.n} treinos com esta rotina e as cargas pararam de subir`,a};return null}

function sessIn(a,b){return S.sessions.filter(x=>{const t=new Date(x.date);return t>=a&&t<b})}
function wkStats(a,b){const L=sessIn(a,b);return {visits:new Set(L.filter(isGym).map(x=>dayKey(x.date))).size,vol:L.reduce((t,x)=>t+(x.activity?0:vol(x)),0),min:Math.round(L.reduce((t,x)=>t+(x.activity?(x.minutes||0):(x.durationSec||0)/60),0)),kcal:L.reduce((t,x)=>t+sessionKcal(x),0)}}
function spark(vals){const W=84,H=22,mx=Math.max(1,...vals);const pts=vals.map((v,i)=>`${(i*W/(vals.length-1)).toFixed(1)},${(H-2-(v/mx)*(H-4)).toFixed(1)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${W}" cy="${(H-2-(vals[vals.length-1]/mx)*(H-4)).toFixed(1)}" r="2.2" fill="var(--accent)"/></svg>`}
function kpi(label,val,cur,prev,vals,fmt){const d=cur-prev;const pct=prev?Math.round(d/prev*100):null;return `<div class="kpi"><span class="kpil">${label}</span><b class="num">${val}</b><div class="kpif"><em class="${d>0?'up':d<0?'down':''}" title="comparado ao mesmo ponto da semana passada">${d===0?'= sem. passada':(d>0?'▲ ':'▼ ')+(pct!==null&&Math.abs(pct)<1000?Math.abs(pct)+'%':fmt(Math.abs(d)))}</em>${spark(vals)}</div></div>`}
function fmtVol(v){return v>=100000?(v/1000).toFixed(0)+' mil kg':Math.round(v).toLocaleString('pt-BR')+' kg'}
function fmtMin(m){return m>=60?Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'):m+' min'}
function barsChart(W12,vals,goal,label,fmt){const W=330,H=150,L=26,R=8,T=14,B=22,n=vals.length,mx=Math.max(goal||0,...vals,1);const bw=(W-L-R)/n;const y=v=>T+(1-v/mx)*(H-T-B);
  const ticks=[0,Math.ceil(mx/2),mx];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" class="gl"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" class="ax">${fmt?fmt(t,1):t}</text>`).join('')}
    ${vals.map((v,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,h=Math.max(v?3:0,(H-T-B)-(y(v)-T));const met=goal&&v>=goal;return `<g data-tip="${W12[i].a.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}: ${fmt?fmt(v):v}${goal?(met?' · meta batida':' · meta '+goal):''}"><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/><path d="M${x} ${H-B}V${H-B-h+4}a4 4 0 0 1 4-4h${w-8}a4 4 0 0 1 4 4V${H-B}z" class="${goal?(met?'bar met':'bar miss'):'bar'}"/></g>`}).join('')}
    ${goal?`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" class="goalline"/><text x="${W-R}" y="${y(goal)-4}" text-anchor="end" class="axg">meta ${goal}</text>`:''}
    ${vals.map((v,i)=>i%3===n%3-1||i===n-1?`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="middle" class="ax">${i===n-1?'esta':W12[i].a.getDate()+'/'+(W12[i].a.getMonth()+1)}</text>`:'').join('')}</svg>`}
function areaChart(W12,vals,label,fmt){const W=330,H=150,L=34,R=10,T=14,B=22,n=vals.length,mx=Math.max(1,...vals);const x=i=>L+i*(W-L-R)/(n-1),y=v=>T+(1-v/mx)*(H-T-B);
  const line=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}"><defs><linearGradient id="arG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${[0,mx/2,mx].map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" class="gl"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" class="ax">${fmt(t,1)}</text>`).join('')}
    <path d="${line}L${x(n-1)} ${H-B}L${x(0)} ${H-B}z" fill="url(#arG)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<g data-tip="${W12[i].a.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}: ${fmt(v)}"><rect x="${x(i)-(W-L-R)/(n-1)/2}" y="${T}" width="${(W-L-R)/(n-1)}" height="${H-T-B}" fill="transparent"/>${i===n-1||v===mx&&v>0?`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`:''}</g>`).join('')}
    ${vals.map((v,i)=>i%3===n%3-1||i===n-1?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" class="ax">${i===n-1?'esta':W12[i].a.getDate()+'/'+(W12[i].a.getMonth()+1)}</text>`:'').join('')}</svg>`}
function groupsChart(){const lim=Date.now()-30*864e5,c={};S.sessions.filter(x=>!x.activity&&new Date(x.date)>=lim).forEach(x=>x.ex.forEach(e=>{const g=exGroups(e.name)[0];if(!g)return;c[g]=(c[g]||0)+e.sets.length}));
  const rows=Object.entries(c).sort((a,b)=>b[1]-a[1]);if(!rows.length)return '<p class="muted" style="margin:0;font-size:14px">Registre treinos com séries para ver quais músculos você mais trabalha.</p>';const mx=rows[0][1];
  return `<div class="hbars">${rows.map(([g,v])=>`<div class="hbar" data-tip="${GRP[g]||g}: ${v} séries em 30 dias"><span>${GRP[g]||g}</span><div><i style="width:${Math.max(4,v/mx*100)}%"></i></div><b class="num">${v}</b></div>`).join('')}</div>`}
function heatmap(){const weeks=18,w0=weekStart(new Date());const start=new Date(w0);start.setDate(w0.getDate()-7*(weeks-1));const byDay={};S.sessions.forEach(x=>{const k=dayKey(x.date);const o=byDay[k]||(byDay[k]={g:0,a:0,v:0});if(x.activity)o.a++;else{o.g++;o.v+=vol(x)}});
  const vols=Object.values(byDay).filter(o=>o.v>0).map(o=>o.v).sort((a,b)=>a-b);const q=vols.length?vols[Math.floor(vols.length*.6)]:0;const today=new Date();
  let cells='';for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);if(dt>today)continue;const o=byDay[dayKey(dt)];const lv=!o?0:o.g?(o.v>=q&&o.v>0?3:2):1;
    cells+=`<rect x="${w*13}" y="${d*13}" width="11" height="11" rx="2.5" class="hm${lv}" data-tip="${dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})}: ${!o?'descanso':o.g?'academia'+(o.v?' · '+fmtVol(o.v):''):'atividade fora'}"/>`}
  return `<svg class="heat" viewBox="-1 -1 ${weeks*13+1} ${7*13+1}" role="img" aria-label="Dias de treino nas últimas ${weeks} semanas">${cells}</svg>
    <div class="hmleg"><span>descanso</span><i class="hm0"></i><i class="hm1"></i><i class="hm2"></i><i class="hm3"></i><span>treino forte</span></div>`}
function dayDone(f,d){return !!(hasBody()&&f.meals.length&&f.closed)}
function calDays(n){const out=[];for(let i=n;i>=1;i--){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);const f=food(d);const ok=dayDone(f,d);out.push({d,has:ok,b:ok?kcalIn(f)-kcalOut(d).total:0})}return out}
function calCard(){const D30=calDays(30),reg=D30.filter(x=>x.has);const t=balTarget();const surplusGoal=t>0;
  if(!reg.length)return `<div class="card"><div class="eyebrow">Balanço calórico · 30 dias</div><p class="muted" style="margin:6px 0 0;font-size:14px">Registre as refeições em Alimentação (foto ou manual) e aqui aparecem seus dias de déficit e superávit.</p></div>`;
  const def=reg.filter(x=>x.b<0).length,sur=reg.length-def,avg=Math.round(reg.reduce((a,x)=>a+x.b,0)/reg.length),hit=surplusGoal?sur:def;
  const W=330,H=150,L=34,R=8,T=12,B=20,n=D30.length,mx=Math.max(300,...reg.map(x=>Math.abs(x.b)));const bw=(W-L-R)/n,mid=T+(H-T-B)/2,sc=(H-T-B)/2/mx;
  const bars=D30.map((x,i)=>{const X=L+i*bw+bw*.15,w=Math.max(2,bw*.7);if(!x.has)return `<rect x="${X}" y="${mid-1}" width="${w}" height="2" class="cnone"/>`;const h=Math.max(2,Math.abs(x.b)*sc);
    return `<g data-tip="${x.d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})}: ${x.b>0?'+':''}${x.b.toLocaleString('pt-BR')} kcal (${x.b<0?'déficit':'superávit'})"><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/><rect x="${X}" y="${x.b<0?mid:mid-h}" width="${w}" height="${h}" rx="1.5" class="${x.b<0?'cdef':'csur'}"/></g>`}).join('');
  const k=v=>Math.round(v/100)/10+'k';
  return `<div class="card"><div class="eyebrow">Balanço calórico · 30 dias</div>
    <div class="calkpi"><div><b class="num">${hit}<small>/${reg.length}</small></b><span>dias em ${surplusGoal?'superávit':'déficit'}</span></div><div><b class="num">${avg>0?'+':''}${avg.toLocaleString('pt-BR')}</b><span>saldo médio por dia</span></div><div><b class="num">${(Math.abs(avg)*reg.length/7700).toFixed(1).replace('.',',')} kg</b><span>${avg<0?'equivale a perder':'equivale a ganhar'}</span></div></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo calórico por dia nos últimos 30 dias">
      <text x="${L-6}" y="${T+8}" text-anchor="end" class="ax">+${k(mx)}</text><text x="${L-6}" y="${mid+4}" text-anchor="end" class="ax">0</text><text x="${L-6}" y="${H-B}" text-anchor="end" class="ax">−${k(mx)}</text>
      <line x1="${L}" x2="${W-R}" y1="${mid}" y2="${mid}" class="gl"/>${bars}
      <text x="${L}" y="${H-5}" class="ax">${D30[0].d.getDate()}/${D30[0].d.getMonth()+1}</text><text x="${W-R}" y="${H-5}" text-anchor="end" class="ax">ontem</text></svg>
    <div class="hmleg" style="justify-content:flex-start"><i class="lg cdef"></i><span>déficit</span><i class="lg csur" style="margin-left:10px"></i><span>superávit</span><i class="lg cnone" style="margin-left:10px"></i><span>sem registro</span></div>
    <div class="chartsub" style="margin:6px 0 0">Só entram dias com refeições registradas. Hoje fica de fora até acabar. Estimativa: ~7.700 kcal ≈ 1 kg.</div></div>`}
function dashboard(){if(!S.sessions.length)return '';const W12=weeksBack(12),st=W12.map(w=>wkStats(w.a,w.b)),cur=st[11],el=Date.now()-W12[11].a.getTime(),prev=wkStats(W12[10].a,new Date(W12[10].a.getTime()+el));const g=goals().week||0;
  return `<div class="muted" style="font-size:12px;margin-bottom:-4px">Esta semana, comparada ao mesmo ponto da semana passada</div><div class="kpis">${kpi('Idas na semana',cur.visits,cur.visits,prev.visits,st.map(x=>x.visits).slice(-8),v=>v)}${kpi('Peso levantado na semana',fmtVol(cur.vol),cur.vol,prev.vol,st.map(x=>x.vol).slice(-8),fmtVol)}${kpi('Tempo treinando',fmtMin(cur.min),cur.min,prev.min,st.map(x=>x.min).slice(-8),fmtMin)}${kpi('Energia gasta',cur.kcal.toLocaleString('pt-BR')+' kcal',cur.kcal,prev.kcal,st.map(x=>x.kcal).slice(-8),v=>v+' kcal')}</div>
    <div class="card"><div class="eyebrow">Frequência · 12 semanas</div><div class="chartsub">${g?`Barras cheias: semanas em que você bateu a meta de ${g}.`:'Dias de academia por semana.'}</div>${barsChart(W12,st.map(x=>x.visits),g,'Idas por semana',(v)=>Math.round(v))}</div>
    <div class="card"><div class="eyebrow">Peso levantado · 12 semanas</div><div class="chartsub">Soma de carga × repetições de todas as séries (ex.: 40 kg × 10 reps = 400 kg). Subir com o tempo é sinal de força.</div>${areaChart(W12,st.map(x=>x.vol),'Volume por semana',(v,ax)=>ax&&v===0?'0':fmtVol(v))}</div>
    <div data-feat="cal">${calCard()}</div>
    <div class="card"><div class="eyebrow">Músculos trabalhados · 30 dias</div><div class="chartsub">Séries por grupo. Um grupo muito abaixo dos outros pede atenção.</div>${groupsChart()}</div>
    <div class="card"><div class="eyebrow">Mapa de batalhas · 18 semanas</div><div class="chartsub">Cada quadrado é um dia. Quanto mais forte, mais pesado foi o treino.</div>${heatmap()}</div>`}
function chart(name){
  const pts=S.sessions.slice().reverse().map(s=>{const e=s.ex.find(x=>x.name===name);if(!e)return null;const m=Math.max(...e.sets.map(t=>+t.kg||0));return m>0?{d:s.date,v:m}:null}).filter(Boolean).slice(-20);
  if(pts.length<2)return `<p class="muted" style="margin:8px 0 0;font-size:14px">${pts.length?'Registre mais um treino com esse exercício para ver a evolução.':'Ainda sem cargas registradas para esse exercício.'}</p>`;
  const W_=320,H=150,L=38,R=14,T=16,B=24;let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  const step=hi-lo>40?10:hi-lo>12?5:2.5;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo){hi+=step;lo=Math.max(0,lo-step)}
  const x=i=>L+i*(W_-L-R)/(pts.length-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const ticks=[lo,(lo+hi)/2,hi];const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const last=pts[pts.length-1],first=pts[0],diff=last.v-first.v;
  return `<svg class="chart" viewBox="0 0 ${W_} ${H}" role="img" aria-label="Carga máxima de ${esc(name)} por treino">
    ${ticks.map(t=>`<line x1="${L}" x2="${W_-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${fmtKg(t)}</text>`).join('')}
    <path d="${line}L${x(pts.length-1)},${H-B}L${L},${H-B}Z" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    <text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${new Date(first.d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</text>
    <text x="${W_-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${new Date(last.d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</text>
  </svg><p class="num" style="margin:6px 0 0;font-size:14px"><b>${fmtKg(last.v)} kg</b> <span class="muted">· ${diff>=0?'+':''}${fmtKg(diff)} kg desde ${new Date(first.d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</span></p>`}

const SERVICES=[['spotify','Spotify',/spotify\./,'https://open.spotify.com','#1db954'],['ytmusic','YouTube Music',/music\.youtube\./,'https://music.youtube.com','#ff0033'],['youtube','YouTube',/youtu\.?be/,'https://www.youtube.com','#ff0033'],
 ['audible','Audible',/audible\./,'https://www.audible.com.br','#f29a1f'],['amazon','Amazon Music',/music\.amazon|amazon\.[a-z.]+\/music/,'https://music.amazon.com.br','#25d1da'],['apple','Apple Podcasts',/podcasts\.apple/,'https://podcasts.apple.com','#9b5de5'],
 ['applemusic','Apple Music',/music\.apple/,'https://music.apple.com','#fa2d48'],['deezer','Deezer',/deezer\./,'https://www.deezer.com','#a238ff'],['kindle','Kindle',/kindle|read\.amazon/,'https://read.amazon.com','#ff9900']];
const KINDS={musica:'Música',podcast:'Podcast',audiobook:'Audiobook'};
function svcOf(url){const u=String(url||'').toLowerCase();return SERVICES.find(x=>x[2].test(u))||['link','Link',null,url,'var(--muted)']}
function audios(){if(!Array.isArray(S.user.audio))S.user.audio=[];return S.user.audio}
function safeUrl(u){u=String(u||'').trim();if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}}
function audioBy(){if(!S.user.audioBy||typeof S.user.audioBy!=='object')S.user.audioBy={};return S.user.audioBy}
function audioFor(wid){const A=audios();if(!A.length)return null;const id=audioBy()[wid];return A.find(x=>x.id===id)||A.slice().sort((a,b)=>(b.used||0)-(a.used||0))[0]}

const GKW=[[/supino|crucifixo|voador|peck|chest|flex[aã]o de bra/,'peito'],[/puxada|remada|pulldown|barra fixa|serrote/,'costas'],[/desenvolvimento|eleva[cç][aã]o lateral|eleva[cç][aã]o frontal|face pull|inverso/,'ombro'],[/rosca/,'biceps'],[/tr[ií]ceps|mergulho|franc/,'triceps'],[/leg press|agachamento|afundo|passada|extensora|hack|bulgaro/,'quad'],[/flexora|stiff|terra/,'post'],[/p[eé]lvica|gl[uú]te|abdu/,'glut'],[/panturrilha/,'pant'],[/prancha|abdominal|dead bug|perdigueiro|pernas/,'core']];
function exGroups(name){const n=norm(name);const l=LIB.find(x=>norm(x.n)===n);if(l)return [l.g];const k=GKW.find(z=>z[0].test(n));return k?[k[1]]:[]}
function repRange(r){r=String(r);if(/min|\bs\b|seg/i.test(r))return null;const m=r.match(/(\d+)(?:\s*-\s*(\d+))?/);if(!m)return null;return {lo:+m[1],hi:+(m[2]||m[1])}}
function lastTwo(exId,name){const out=[];for(const s of S.sessions){if(s.checkin||s.activity)continue;const e=s.ex.find(x=>x.exId===exId)||s.ex.find(x=>x.name===name);if(e&&e.sets.length)out.push(e);if(out.length===2)break}return out}
function suggestFor(exId,name,target){const rr=repRange(target.reps);if(!rr)return null;const L=lastTwo(exId,name);if(!L.length)return null;
  const mx=e=>Math.max(0,...e.sets.map(t=>+t.kg||0));const k0=mx(L[0]);if(!k0)return null;
  const ok=e=>e.sets.length>=1&&e.sets.every(t=>(+t.reps||0)>=rr.hi)&&mx(e)===k0;
  if(L.length===2&&ok(L[0])&&ok(L[1])){const inc=k0>=30?2.5:k0>=10?2:1;return {kind:'up',kg:Math.round((k0+inc)*10)/10,msg:`Você fez ${rr.hi} repetições com ${fmtKg(k0)} kg duas vezes. Hoje é ${fmtKg(k0+inc)} kg.`}}
  if(L[0].sets.some(t=>(+t.reps||0)<rr.lo))return {kind:'hold',kg:k0,msg:`Na última vez faltaram repetições com ${fmtKg(k0)} kg. Mantenha até completar todas.`};
  return null}

function hav(a,b){const R=6371000,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function parseGpx(txt){const doc=new DOMParser().parseFromString(txt,'application/xml');if(doc.querySelector('parsererror'))throw new Error('xml');
  let pts=[...doc.getElementsByTagName('trkpt')];if(!pts.length)pts=[...doc.getElementsByTagName('rtept')];if(pts.length<2)throw new Error('vazio');
  const P=pts.map(n=>{const t=n.getElementsByTagName('time')[0],e=n.getElementsByTagName('ele')[0];return [+n.getAttribute('lat'),+n.getAttribute('lon'),t?Date.parse(t.textContent):NaN,e?+e.textContent:NaN]}).filter(x=>isFinite(x[0])&&isFinite(x[1]));
  let dist=0,mov=0,gain=0,ref=isFinite(P[0][3])?P[0][3]:null;for(let i=1;i<P.length;i++){const d=hav(P[i-1],P[i]);dist+=d;const dt=(P[i][2]-P[i-1][2])/1000;if(isFinite(dt)&&dt>0&&dt<120&&d/dt>0.4)mov+=dt;const e=P[i][3];if(isFinite(e)){if(ref===null)ref=e;else if(e-ref>=2){gain+=e-ref;ref=e}else if(e<ref)ref=e}}
  const t0=P[0][2],t1=P[P.length-1][2];const elapsed=isFinite(t0)&&isFinite(t1)?(t1-t0)/1000:0;if(!mov)mov=elapsed;
  const typeTag=(doc.getElementsByTagName('type')[0]||{}).textContent||'';const name=(doc.querySelector('trk > name')||doc.querySelector('metadata > name')||{}).textContent||'';
  const step=Math.max(1,Math.ceil(P.length/150));const route=P.filter((_,i)=>i%step===0||i===P.length-1).map(x=>[+x[0].toFixed(5),+x[1].toFixed(5)]);
  return {dist,mov,elapsed,gain:Math.round(gain),start:isFinite(t0)?t0:null,route,typeTag:typeTag.toLowerCase(),name:name.trim()}}
function gpxType(g){const t=g.typeTag+' '+norm(g.name);if(/run|corrida|correr/.test(t))return 'corrida';if(/ride|bike|cycl|pedal|bici/.test(t))return 'bike';if(/hik|trilha/.test(t))return 'trilha';if(/walk|caminh/.test(t))return 'caminhada';
  const kmh=g.mov?g.dist/g.mov*3.6:0;return kmh>16?'bike':kmh>7.2?'corrida':'caminhada'}
function gpxInt(type,g){const kmh=g.mov?g.dist/g.mov*3.6:0;if(type==='corrida')return kmh>=11?2:kmh>=8.9?1:0;if(type==='bike')return kmh>=25?2:kmh>=18?1:0;if(type==='caminhada')return kmh>=6?2:kmh>=4.8?1:0;return g.gain>300?2:1}

function routeSvg(rt,size){if(!rt||rt.length<2)return '';const lat0=rt[0][0]*Math.PI/180,k=Math.cos(lat0);const xs=rt.map(p=>p[1]*k),ys=rt.map(p=>-p[0]);const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);const sc=90/Math.max(mxx-mnx,mxy-mny,1e-9);
  const ox=(100-(mxx-mnx)*sc)/2,oy=(100-(mxy-mny)*sc)/2;const pts=rt.map((p,i)=>((xs[i]-mnx)*sc+ox).toFixed(1)+','+((ys[i]-mny)*sc+oy).toFixed(1));
  return `<svg class="route" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[0].split(',')[0]}" cy="${pts[0].split(',')[1]}" r="4" fill="var(--good)"/><circle cx="${pts[pts.length-1].split(',')[0]}" cy="${pts[pts.length-1].split(',')[1]}" r="4" fill="var(--hot)"/></svg>`}

function weighs(){return LS.get('ct.weighs',[])}

function nextWeigh(){const l=lastWeigh(),f=weighFreq();if(!l||!f)return null;const d=new Date(l.d+'T08:00:00');d.setDate(d.getDate()+f);return d}
function weighDue(){const n=nextWeigh();return n&&Date.now()>=n.getTime()-12*36e5}

    ${S.wOpen?`<div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap"><input id="wKg" class="wname" inputmode="decimal" placeholder="kg" style="width:90px" value="${l?String(l.kg).replace('.',','):''}"><input id="wDate" type="date" class="wname" style="flex:1;min-width:130px" value="${todayISO()}" max="${todayISO()}"><button class="btn primary sm" data-act="wsave">Salvar</button></div>

function weighFeedback(prev,kg){const g=profile().goal;if(!prev)return 'Primeira pesagem registrada. A partir de agora a gente olha a tendência, não o número do dia.';const d=Math.round((kg-prev.kg)*10)/10;
  const good=(g==='emagrecimento'&&d<0)||((g==='hipertrofia'||g==='forca')&&d>0);if(good)return `${d>0?'+':''}${String(d).replace('.',',')} kg na direção certa. Constância aparecendo na balança.`;

function insights(){const out=[],lim=Date.now()-60*864e5,L=S.sessions.filter(x=>new Date(x.date)>=lim&&!x.checkin);if(L.length<3)return out;
  const c={};L.forEach(x=>{const k=x.activity?(MET[x.activity]||['Atividade'])[0]:'Academia';c[k]=(c[k]||0)+1});const tot=L.length;const top=Object.entries(c).sort((a,b)=>b[1]-a[1]);

  const hrs=L.map(x=>new Date(x.date).getHours()).filter(h=>h>=5);if(hrs.length>=3){const b={manhã:0,tarde:0,noite:0};hrs.forEach(h=>b[h<12?'manhã':h<18?'tarde':'noite']++);const best=Object.entries(b).sort((a,b2)=>b2[1]-a[1])[0];if(best[1]/hrs.length>=.5)out.push({ic:'🕒',k:'hora',t:`Você treina mais de ${best[0]} (${Math.round(best[1]/hrs.length*100)}% das vezes)`})}

  const sk={};S.sessions.filter(x=>x.skipped&&new Date(x.date)>=lim).forEach(x=>x.skipped.forEach(e=>{const k=e.name;sk[k]=sk[k]||{n:0,why:{}};sk[k].n++;sk[k].why[e.why]=(sk[k].why[e.why]||0)+1}));
  Object.entries(sk).filter(([,v])=>v.n>=2).slice(0,2).forEach(([n,v])=>{const w=Object.entries(v.why).sort((a,b)=>b[1]-a[1])[0][0];out.push({ic:'⚠',k:'skip',t:`Pulou ${n} ${v.n}× (${w.toLowerCase()})`})});
  return out}
function overload(){const vs=exSet(),out={score:0,why:[],strong:false};
  let run=0;{const d=new Date();if(!vs.has(dayKey(d)))d.setDate(d.getDate()-1);for(let i=0;i<30;i++){if(vs.has(dayKey(d)))run++;else break;d.setDate(d.getDate()-1)}}
  if(run>=10){out.score+=2;out.strong=true;out.why.push(`${run} dias seguidos sem descanso`)}else if(run>=7){out.score+=1;out.why.push(`${run} dias seguidos sem descanso`)}
  const W=weeksBack(5).map(w=>wkStats(w.a,w.b));const cur=W[4],el=(Date.now()-weeksBack(1)[0].a.getTime())/(7*864e5);const base=(W[0].min+W[1].min+W[2].min+W[3].min)/4;const proj=el>0.2?cur.min/el:cur.min;
  if(base>=120&&proj>base*1.6&&cur.min>=240){out.score+=proj>base*1.9?2:1;if(proj>base*1.9)out.strong=true;out.why.push(`volume da semana ${Math.round((proj/base-1)*100)}% acima da sua média`)}
  const lim=Date.now()-6*864e5,G={};S.sessions.filter(x=>!x.activity&&new Date(x.date)>=lim).forEach(x=>{const k=dayKey(x.date);x.ex.forEach(e=>{const g=exGroups(e.name)[0];if(!g||g==='core')return;G[g]=G[g]||{};G[g][k]=(G[g][k]||0)+e.sets.length})});
  const back=[];Object.entries(G).forEach(([g,days])=>{const ks=Object.keys(days).filter(k=>days[k]>=8).map(k=>new Date(k.replace(/-/g,'/')).getTime()).sort();for(let i=1;i<ks.length;i++)if(ks[i]-ks[i-1]<=1.1*864e5){back.push(GRP[g]||g);break}});

function habits(){const out=[];const days=[1,2,3,4,5,6,7].map(i=>{const d=new Date();d.setDate(d.getDate()-i);return food(d)}).filter(f=>f.water||f.prot||f.meals.length);

  {const o=overload();if(o.flag)out.push({k:'descanso',sev:2,ic:'🛌',t:`Sinais de excesso: ${o.why.join(', ')}`,fix:'Descanso é parte do treino: é nele que o músculo cresce e o corpo se recupera. Um ou dois dias de folga agora rendem mais que forçar.'})}
  {const lim=Date.now()-21*864e5;const L=S.sessions.filter(x=>!x.activity&&!x.quick&&!x.checkin&&new Date(x.date)>=lim);const sk=L.filter(x=>(x.skipped||[]).length).length;if(L.length>=4&&sk/L.length>=.5)out.push({k:'pula',sev:1,ic:'✂',t:`Pulou exercícios em ${sk} de ${L.length} treinos recentes`,fix:'Talvez o treino esteja longo demais para sua rotina. Posso encurtar: é só pedir no chat.'})}

function ageOf(){const b=body();if(b.birth){const d=new Date(b.birth+'T12:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))a--;return a>0&&a<110?a:30}return +b.age||30}

function sessionKcal(s){if(s.checkin)return 0;if(s.activity){const m=MET[s.activity]||MET.outro;return kcalFor(m[1+(s.intensity??1)],s.minutes||0)}

function gymMet(ex,min){const bw=+body().weight||70;let vol=0,cardio=0,sets=0;
  (ex||[]).forEach(e=>{const isC=CARDIO_RX.test(e.name||'');(e.sets||[]).forEach(t=>{if(t.done===false)return;const kg=+String(t.kg||0).replace(',','.')||0,r=+t.reps||0;if(isC){cardio+=r>0&&r<=90?r:0;return}sets++;vol+=(kg>0?kg*kgKind(e.name).mul:bw*.6)*(r||10)})});
  const liftMin=Math.max(1,min-cardio);if(!sets)return {met:MET_GYM,cardio,liftMin};const dens=vol/liftMin/bw;return {met:3.5+Math.min(1,dens/2)*2.5,cardio,liftMin}}

/* ---------- gamificação ---------- */
const RANKS=[['Recruta','#9aa2b1'],['Escudeiro','#2e9e5b'],['Guerreiro','#e9b10f'],['Berserker','#244aa0'],['Jarl','#d93a2b'],['Einherjar','#b07cff'],['Lenda de Valhalla','#f2c230']];
const ROMAN=['I','II','III'];
const WEEK_BONUS=150,WEEK_PENALTY=150;
function xpBase(s){if(s.checkin)return 30;if(s.activity)return 40+Math.min(s.minutes||0,90);return 100+Math.min(s.ex.reduce((n,e)=>n+e.sets.length,0)*2,60)}
function xpOf(s){const b=xpBase(s);return season(new Date(s.date))==='inverno'?Math.round(b*1.25):b}
function weekMap(){const wk=new Map();S.sessions.filter(isGym).forEach(s=>{const k=weekStart(s.date).getTime();if(!wk.has(k))wk.set(k,new Set());wk.get(k).add(dayKey(s.date))});return wk}
function weekHistory(){const g=goals().week,wk=weekMap();if(!S.sessions.length)return [];const first=weekStart(S.sessions[S.sessions.length-1].date),cur=weekStart(new Date());const out=[];
  for(let d=new Date(first);d<cur;d.setDate(d.getDate()+7)){const n=(wk.get(d.getTime())||new Set()).size,eg=effGoal(d);out.push({start:new Date(d),n,goal:eg,excused:eg===0,met:eg>0&&n>=eg})}return out}
function weeksMet(){return weekHistory().filter(w=>w.met).length}
function weeksExcused(){return weekHistory().filter(w=>w.excused).length}
function weeksMissed(){return weekHistory().filter(w=>!w.met&&!w.excused).length}
function earnedXP(){return S.sessions.reduce((a,s)=>a+xpOf(s),0)+weeksMet()*WEEK_BONUS}
function totalXP(){const H=weekHistory(),byW=new Map();S.sessions.forEach(x=>{const k=weekStart(x.date).getTime();byW.set(k,(byW.get(k)||0)+xpOf(x))});let bal=0;H.forEach(w=>{bal+=byW.get(w.start.getTime())||0;if(w.met)bal+=WEEK_BONUS;else if(!w.excused)bal=Math.max(0,bal-WEEK_PENALTY)});return bal+(byW.get(weekStart(new Date()).getTime())||0)}
function penTxt(){const t=totalXP();return t<=0?'Se não bater, fica sem o bônus da semana.':t<WEEK_PENALTY?`Se não bater, perde os ${t} XP que tem (o mínimo é zero).`:`Se não bater, perde ${WEEK_PENALTY} XP.`}
function xpForLevel(L){return L<=1?0:Math.round(150*Math.pow(L-1,1.5)/10)*10}
function levelOf(xp){let L=1;while(xpForLevel(L+1)<=xp)L++;const ri=Math.min(RANKS.length-1,Math.floor((L-1)/3));const R=RANKS[ri];
  const name=ri<RANKS.length-1?`${R[0]} ${ROMAN[(L-1)%3]}`:`${R[0]}${L-1-(RANKS.length-1)*3>0?' ★'+(L-1-(RANKS.length-1)*3):''}`;
  return {L,ri,name,rank:R[0],color:R[1],min:xpForLevel(L),next:xpForLevel(L+1)}}
function rankStart(ri){return xpForLevel(ri*3+1)}
function dayStreak(){const ds=exSet();const d=new Date();if(!ds.has(dayKey(d)))d.setDate(d.getDate()-1);let n=0;for(let i=0;i<730;i++){if(ds.has(dayKey(d)))n++;else if(!pauseOn(d))break;d.setDate(d.getDate()-1)}return n}
function maxStreak(){const days=[...new Set(S.sessions.map(s=>{const d=new Date(s.date);d.setHours(0,0,0,0);return d.getTime()}))].sort((a,b)=>a-b);let best=0,cur=0,prev=null;
  days.forEach(t=>{cur=prev!==null&&Math.round((t-prev)/864e5)===1?cur+1:1;best=Math.max(best,cur);prev=t});return best}
function metStreakWeeks(){const h=weekHistory();let n=0;for(let i=h.length-1;i>=0;i--){if(h[i].excused)continue;if(!h[i].met)break;n++}return n}
function stats(){const tr=S.sessions.filter(s=>!s.checkin&&!s.activity);return {treinos:tr.length,ativ:S.sessions.filter(s=>s.activity).length,kcal:S.sessions.reduce((a,s)=>a+sessionKcal(s),0),
  streak:maxStreak(),weeks:weeksMet(),cedo:tr.filter(s=>new Date(s.date).getHours()<7).length,noite:tr.filter(s=>new Date(s.date).getHours()>=21).length,longo:tr.filter(s=>s.durationSec>=90*60).length}}
/* conquistas infinitas: cada família tem degraus que continuam crescendo */
function tiersFrom(list,grow){return t=>t<list.length?list[t]:grow(list[list.length-1],t-list.length+1)}
const FAMILIES=[
 ['forja','Forja','Treinos concluídos','treinos',tiersFrom([1,10,25,50,100,250,500,1000],(l,k)=>l*Math.pow(2,k)),n=>`${n} ${n===1?'treino':'treinos'}`],
 ['chama','Chama de Muspel','Dias seguidos de exercício (seu recorde)','streak',tiersFrom([3,7,14,30,60,100,180,365],(l,k)=>l+100*k),n=>`${n} dias seguidos`],
 ['juramento','Juramento','Semanas com a meta batida','weeks',tiersFrom([1,4,8,12,26,52],(l,k)=>l+26*k),n=>`${n} ${n===1?'semana':'semanas'} na meta`],
 ['andarilho','Andarilho','Atividades fora da academia','ativ',tiersFrom([1,5,10,25,50,100],(l,k)=>l*Math.pow(2,k)),n=>`${n} ${n===1?'atividade':'atividades'}`],
 ['fornalha','Fornalha','Calorias gastas no total','kcal',tiersFrom([1000,5000,10000,25000,50000,100000],(l,k)=>l*Math.pow(2,k)),n=>`${n.toLocaleString('pt-BR')} kcal`],
 ['aurora','Filho da Aurora','Treinos antes das 7h','cedo',tiersFrom([1,5,10,25,50],(l,k)=>l*Math.pow(2,k)),n=>`${n} ${n===1?'treino':'treinos'} antes das 7h`],
 ['vigia','Vigia da Noite','Treinos depois das 21h','noite',tiersFrom([1,5,10,25,50],(l,k)=>l*Math.pow(2,k)),n=>`${n} ${n===1?'treino':'treinos'} depois das 21h`],
 ['folego','Fôlego de Gigante','Treinos de 1h30 ou mais','longo',tiersFrom([1,5,10,25,50],(l,k)=>l*Math.pow(2,k)),n=>`${n} ${n===1?'treino longo':'treinos longos'}`]];
function famState(f,st){const v=st[f[3]],T=f[4];let t=0;while(v>=T(t))t++;return {tier:t,value:v,next:T(t),prev:t?T(t-1):0}}
function allTiers(){const st=stats(),o={};FAMILIES.forEach(f=>o[f[0]]=famState(f,st).tier);return o}
/* status: podem ser perdidos */
function statusList(){const st=dayStreak(),ws=metStreakWeeks(),ds=daysSinceLast();return [
 {id:'chamas',name:'Em chamas',desc:'7 dias seguidos ou mais agora',on:st>=7,hint:st>=7?`${st} dias e contando`:`sequência atual: ${st} ${st===1?'dia':'dias'}`},
 {id:'inabalavel',name:'Inabalável',desc:'4 semanas seguidas batendo a meta',on:ws>=4,hint:`${ws} de 4 semanas seguidas`},
 {id:'ferrugem',name:'Ferrugem',desc:'7 dias ou mais sem exercício',bad:true,on:!activePause()&&ds!==null&&ds>=7,hint:ds!==null&&ds>=7?`${ds} dias parado. Volte para tirar a ferrugem.`:'você está em dia'}]}
function weekRisk(){const ap=activePause();if(ap)return {ok:true,pause:true,msg:`Metas em pausa (${(PAUSE_R[ap.reason]||PAUSE_R.outro)[0].toLowerCase()}). Nada de perder XP enquanto isso.`};const g=effGoal(weekStart(new Date())),wk=weekStrip().n;if(g===0)return {ok:true,msg:'Semana quase toda em pausa: ela não conta para a meta.'};if(wk>=g)return {ok:true,msg:'Meta da semana garantida: +'+WEEK_BONUS+' XP no domingo.'};
  const left=daysLeftWeek(),need=g-wk;const wknd=left.filter(d=>d===6||d===0);
  if(need>left.length)return {ok:false,lost:true,msg:`Não dá mais para bater a meta desta semana. ${totalXP()>0?'Você vai perder '+Math.min(WEEK_PENALTY,totalXP())+' XP no domingo (o mínimo é zero).':'Fica sem o bônus desta semana.'}`};
  const tight=need===left.length;
  return {ok:false,lost:false,msg:`Faltam ${need} ${gNoun(need)}. Ainda dá: ${dayList(left)}.${tight?' Sem folga: precisa ir em todos.':wknd.length&&need>=left.length-wknd.length?' O fim de semana vai salvar sua semana.':''} ${penTxt()}`}}
function snapshot(){return {L:levelOf(totalXP()).L,tiers:allTiers(),status:statusList().filter(x=>x.on&&!x.bad).map(x=>x.id)}}
(function(){if(LS.get('ct.g2',null)===null)LS.set('ct.g2',snapshot())})();
function celebrate(msg){const old=LS.get('ct.g2',snapshot()),now=snapshot();LS.set('ct.g2',now);let extra='';
  const lv=levelOf(totalXP());
  if(now.L>old.L)extra=` Agora você é ${lv.name}. Skål!`;
  else{const f=FAMILIES.find(f=>(now.tiers[f[0]]||0)>(old.tiers[f[0]]||0));if(f)extra=` Conquista: ${f[1]} ${ROMAN[now.tiers[f[0]]-1]||now.tiers[f[0]]}. Mereceu.`;
    else{const st=now.status.find(x=>!old.status.includes(x));if(st)extra=` Status: ${statusList().find(x=>x.id===st).name}. Não perca.`}}
  toast(msg+extra);setTimeout(()=>{const t=[...document.querySelectorAll('.toast')].pop();if(t)t.classList.add('win')},0)}
function checkDecline(){const old=LS.get('ct.g2',null);if(!old)return;const now=snapshot();LS.set('ct.g2',now);
  if(now.L<old.L){setTimeout(()=>toast(`Você caiu para ${levelOf(totalXP()).name}. Guerreiro que cai, levanta. Bata a meta desta semana.`),900);return}
  const lost=old.status.filter(x=>!now.status.includes(x));if(lost.length){const n=statusList().find(x=>x.id===lost[0]);setTimeout(()=>toast(`Você perdeu "${n.name}". O que se perde na preguiça, se reconquista no ferro.`),900)}}
function plateIcon(color,size){return `<svg viewBox="0 0 40 40" width="${size}" height="${size}" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="${color}"/><circle cx="20" cy="20" r="13" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><circle cx="20" cy="20" r="4.5" fill="var(--surface)"/></svg>`}
function gameCard(){const xp=totalXP(),lv=levelOf(xp),st=dayStreak();const pct=Math.round((xp-lv.min)/(lv.next-lv.min)*100);const risk=weekRisk();const rust=statusList().find(x=>x.id==='ferrugem').on;
  return `<div class="card stack game">
    <div class="row">${plateIcon(lv.color,48)}<div style="flex:1;min-width:0"><div class="eyebrow">Nível ${lv.L}</div><div class="lvname">${lv.name}</div></div>
      <div class="streak">${(()=>{const n=Math.min(st,5),hs=[22,22,18,15,12];let x=10,r='';for(let k=0;k<5;k++){const h=hs[k],w=k<2?4.2:3.6;r+=`<rect x="${x}" y="${14-h/2}" width="${w}" height="${h}" rx="1.4" fill="${k<n?'var(--hot)':'none'}" stroke="${k<n?'none':'var(--line)'}" stroke-width="1" opacity="${k<n?1:.45}"/>`;x+=w+1.6}return `<svg viewBox="0 0 46 28" width="46" height="28" aria-hidden="true"><rect x="0" y="12.5" width="46" height="3" rx="1.5" fill="var(--muted)" opacity=".55"/><rect x="6" y="8" width="3" height="12" rx="1" fill="var(--muted)" opacity=".8"/>${r}</svg>`})()}<b class="num">${st}</b><span>${st===1?'dia':'dias'}<br>${st===1?'seguido':'seguidos'}</span></div></div>
    <div><div class="progress"><i style="width:${pct}%;background:${lv.color}"></i></div>
      <div class="row muted num" style="justify-content:space-between;font-size:13px;margin-top:5px"><span>${xp.toLocaleString('pt-BR')} XP</span><span>faltam ${(lv.next-xp).toLocaleString('pt-BR')} para o nível ${lv.L+1}</span></div></div>
    <div class="risk ${risk.ok?'ok':risk.lost?'bad':''}">${rust?'Ferrugem: 7+ dias parado. Cada semana sem meta tira XP e pode derrubar sua patente.':risk.msg}</div>
    <div class="row" style="flex-wrap:wrap"><button class="btn ghost sm" data-act="conq" style="flex:1">Conquistas</button><button class="btn ghost sm" data-act="ativ" style="flex:1">+ Outra atividade</button></div>
  </div>`}
function viewConq(){const xp=totalXP(),lv=levelOf(xp),st=stats();const risk=weekRisk();
  return `<div class="stack"><div class="row"><button class="ic" data-act="go" data-v="hoje" aria-label="Voltar">←</button><div class="eyebrow" style="flex:1">Conquistas</div><button class="btn ghost sm" data-act="saga">Saga do mês</button></div>
  <div class="card stack"><div class="row">${plateIcon(lv.color,56)}<div><div class="eyebrow">Nível ${lv.L} · ${xp.toLocaleString('pt-BR')} XP</div><div class="lvname">${lv.name}</div></div></div>

    <p class="muted" style="font-size:13px;margin:0">Cada patente tem 3 graus (I, II e III). Depois da Lenda de Valhalla, você continua ganhando estrelas para sempre.</p></div>
  <div class="risk ${risk.ok?'ok':risk.lost?'bad':''}">${risk.msg}</div>

    <li><span>Treino concluído</span><b>+100 a 160</b></li><li><span>Atividade fora da academia</span><b>+40 e 1 por minuto</b></li><li><span>Check-in</span><b>+30</b></li><li><span>Bônus de inverno (jun a set)</span><b>+25% em tudo</b></li>

  </div>`}

function backupCard(){return `<div class="card stack"><div class="eyebrow">Backup</div><p class="muted" style="margin:0;font-size:14px">${cloudOn()&&sbSess()?'Tudo já está salvo na nuvem. Se quiser uma cópia extra, baixe o arquivo.':'Baixe um backup de vez em quando para não perder nada.'}</p>

function prsInDays(days){const lim=Date.now()-days*864e5;const best={},out=[];S.sessions.filter(x=>!x.checkin&&!x.activity).slice().sort((a,b)=>a.date<b.date?-1:1).forEach(x=>x.ex.forEach(e=>{const m=Math.max(0,...e.sets.map(t=>+t.kg||0));if(!m)return;
  if(best[e.name]!==undefined&&m>best[e.name]&&new Date(x.date)>=lim){const o=out.find(r=>r.name===e.name);if(o)o.kg=m;else out.push({name:e.name,kg:m})}best[e.name]=Math.max(best[e.name]||0,m)}));return out}
function viewHist(){
  if(!S.sessions.length)return `<div class="stack"><div><div class="eyebrow">Histórico</div><h2>Seus treinos</h2></div>
    <div class="card empty"><h3>Nenhum treino ainda</h3><p style="margin:0">Cada treino ou atividade registrada aparece aqui com a carga de cada série, o volume total e a evolução de cada exercício.</p>
    <button class="btn primary" style="margin-top:14px" data-act="go" data-v="hoje">Ir para o treino de hoje</button></div>${backupCard()}</div>`;
  const now=Date.now(),d30=new Set(S.sessions.filter(s=>now-new Date(s.date)<30*864e5).map(s=>dayKey(s.date))).size,allV=visitSet().size;
  const names=[...new Set(S.sessions.filter(s=>!s.checkin&&!s.activity).flatMap(s=>s.ex.map(e=>e.name)))];if(!S.histEx||!names.includes(S.histEx))S.histEx=names[0];
  const totalVol=S.sessions.filter(s=>now-new Date(s.date)<30*864e5).reduce((a,s)=>a+vol(s),0);
  return `<div class="stack">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><div class="eyebrow">Histórico</div><h2>Seus treinos</h2></div><button class="btn ghost sm" data-act="saga">Saga do mês ›</button></div>
    ${(()=>{const H=weekHistory().filter(w=>!w.excused).slice(-8);const met=H.filter(w=>w.met).length;const cons=H.length?Math.round(met/H.length*100):null;
      const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);const p0=new Date(m0);p0.setMonth(p0.getMonth()-1);const thisM=visitsBetween(m0,new Date(m0.getFullYear(),m0.getMonth()+1,1)),lastM=visitsBetween(p0,new Date(Math.min(m0.getTime(),new Date(p0.getFullYear(),p0.getMonth(),new Date().getDate()+1).getTime())));const dm=thisM-lastM;

  if(!ex.length){toast('Nenhuma série marcada? Não salvo treino que não aconteceu.');return}
  const durS=Math.round((Date.now()-a.start)/1000);const sess={id:a.id,date:new Date(a.start).toISOString(),workoutId:a.workoutId,name:a.name,durationSec:durS,ex};{const sk=a.ex.filter(e=>e.skip).map(e=>({name:e.name,why:e.skip}));if(sk.length)sess.skipped=sk}if(a.body)sess.body=a.body;sess.kcal=sessionKcal(sess);addSession(sess);

    if(left<=10.2&&left>9&&!S.rest.ten&&S.rest.kind!=='stretch'){S.rest.ten=true;speak('Dez segundos.')}

      saveActive();break}
    case 'addset':{const st=a.ex[ei].sets;const p=st[st.length-1];st.push({kg:p?p.kg:'',reps:'',done:false});saveActive();break}
    case 'rmset':a.ex[ei].sets.pop();saveActive();break;
    case 'finish':if(!twoStep('finish'))return;finishSession();break;
    case 'discard':if(!twoStep('discard'))return;S.active=null;S.rest=null;saveActive();try{wake&&wake.release()}catch(_){};break;
    case 'edsel':S.edit=b.dataset.id;break;
    case 'addw':{const used=new Set(S.plan.workouts.map(w=>w.id));const id='ABCDEFG'.split('').find(c=>!used.has(c));S.plan.workouts.push({id,name:'Novo treino',ex:[E('Novo exercício',3,'10',60)]});S.edit=id;savePlan();break}
    case 'rmw':if(!twoStep('rmw'))return;{const r=S.plan.workouts.splice(wi,1)[0];if(S.plan.next===r.id)S.plan.next=S.plan.workouts[0].id;S.edit=null;savePlan()}break;
    case 'addex':S.plan.workouts[wi].ex.push(E('Novo exercício',3,'10',60));savePlan();setTimeout(()=>{const ins=main.querySelectorAll('.ed-ex input[data-f=name]');const l=ins[ins.length-1];l&&(l.focus(),l.select())},0);break;
    case 'timetog':{const ex=S.plan.workouts[wi].ex[xi];delete ex.orig;if(tUnit(ex.reps)){ex.treps=ex.reps;ex.reps=ex.rreps||'10-12'}else{ex.rreps=ex.reps;ex.reps=ex.treps||'30 s';ex.bar=false}savePlan();break}
    case 'up':case 'down':{const ex=S.plan.workouts[wi].ex,j=act==='up'?xi-1:xi+1;[ex[xi],ex[j]]=[ex[j],ex[xi]];savePlan();break}
    case 'rmex':if(!twoStep(b.dataset.k))return;S.plan.workouts[wi].ex.splice(xi,1);savePlan();break;
    case 'reset':if(!twoStep('reset'))return;{archivePlan('Substituída pela rotina padrão');const pf=S.plan.profile;S.plan=JSON.parse(JSON.stringify(DEFAULT_PLAN));S.plan.profile=pf}S.plan.workouts.forEach(w=>w.ex.forEach(x=>x.id=uid()));S.edit=null;savePlan();toast('Voltamos à rotina padrão.');break;
    case 'delsess':if(!twoStep('ds'+b.dataset.id))return;delSession(b.dataset.id);break;
  }
  S.armed=null;render();
});
