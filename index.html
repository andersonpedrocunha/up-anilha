<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Up Anilha">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Seu treino, check-in, metas e evolução de cargas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Up Anilha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: single column phone app, sticky header, bottom tab bar, rest timer docked above it. Plate colors (IWF 20 kg blue, 15 kg yellow) drive the accents. */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#e2e6ec; --ink:#141820; --muted:#5b6474; --line:#d5dae2;
  --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#dfe7fb;
  --hot:#e9b10f; --hot-ink:#1a1400; --good:#18804a; --good-soft:#dcf1e5; --danger:#c2362b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1015; --surface:#171a22; --sunk:#1f232d; --ink:#eceef3; --muted:#98a0b0; --line:#2a2f3b;
  --accent:#6a8eff; --accent-ink:#0a0d14; --accent-soft:#1d2645;
  --hot:#f2c230; --hot-ink:#1a1400; --good:#43c983; --good-soft:#15301f; --danger:#ff6b5e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#171a22; --sunk:#1f232d; --ink:#eceef3; --muted:#98a0b0; --line:#2a2f3b;
  --accent:#6a8eff; --accent-ink:#0a0d14; --accent-soft:#1d2645;
  --hot:#f2c230; --hot-ink:#1a1400; --good:#43c983; --good-soft:#15301f; --danger:#ff6b5e; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 180px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.005em}
h3{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;margin:0;text-transform:uppercase}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--sunk);min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;min-height:56px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
/* plate badge */
.plate{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--accent-ink) 22%,transparent),inset 0 0 0 16px var(--accent),inset 0 0 0 17px color-mix(in srgb,var(--accent-ink) 30%,transparent)}
.plate.sm{width:40px;height:40px;font-size:21px;box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-family:var(--display);font-size:18px;min-width:48px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.exlist{list-style:none;margin:0;padding:0}
.exlist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.exlist li:first-child{border-top:0}
.exlist .n{min-width:0;font-weight:600}
.exlist .t{flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
/* week dots */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week span{font-size:11px;color:var(--muted);font-weight:600}
.week b{display:block;margin:4px auto 0;width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.week b.done{background:var(--accent);border-color:var(--accent)}
.week b.today{border-color:var(--ink)}
/* session */
.ex{padding:14px 14px 10px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head>div{min-width:0}
.ex-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.last{font-size:13px;color:var(--muted);margin-top:4px}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 52px;gap:6px 8px;align-items:center;margin-top:10px}
.sets .h{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.sets .i{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-size:18px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.sets input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.chk{width:52px;height:46px;border-radius:10px;border:2px solid var(--line);background:transparent;font-size:20px;font-weight:800;color:var(--muted)}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.setrow-done input{background:var(--good-soft);border-color:transparent}
.platecalc{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-2px;font-variant-numeric:tabular-nums}
.ex-foot{display:flex;gap:8px;margin-top:8px}
.ex-foot .btn{flex:1}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--good);transition:width .3s}
/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 8px}
.rest-in{max-width:560px;margin:0 auto;background:var(--hot);color:var(--hot-ink);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.rest-in .clock{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;min-width:96px}
.rest-in .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0}
.rest-in button{border:0;background:rgb(0 0 0 / .12);color:inherit;border-radius:10px;min-height:42px;padding:0 12px;font-weight:700}
.rest.done .rest-in{background:var(--good);color:#fff}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;height:64px;font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.hist li{display:block}
.hist .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.chart{width:100%;height:auto;display:block}
select.sel{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-weight:600}
/* editor */
.ed-ex{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.ed-ex:first-of-type{border-top:0}
.ed-ex input[type=text],.ed-ex input[type=number],.ed-ex select,.wname{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
.ed-grid{display:grid;grid-template-columns:64px 1fr 1fr auto;gap:8px;align-items:end}
.ed-grid label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;min-width:0}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600;padding-bottom:9px}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.ed-tools{display:flex;gap:6px;justify-content:flex-end}
.ic{width:38px;height:36px;border-radius:9px;border:1px solid var(--line);background:transparent;font-weight:700}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.big{display:flex;align-items:baseline;gap:6px;font-family:var(--display);font-weight:800;line-height:1}
.big b{font-size:54px}.big span{font-size:26px;color:var(--muted)}
.btn.checked{background:var(--good-soft);color:var(--good)}
.mrow{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
details.goals summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.stepper{display:flex;align-items:center;gap:10px}.stepper b{min-width:24px;text-align:center;font-size:18px}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
.pf .full{grid-column:1/-1}
.pf select,.pf textarea{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-size:15px;font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0;width:100%;min-width:0;resize:vertical;font-family:var(--body)}
.chatlog{display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.msg.ai{background:var(--sunk);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.dots{color:var(--muted)}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.chip.sug{font-family:var(--body);font-size:14px;font-weight:600;padding:8px 12px;text-align:left}
.chatform{display:flex;gap:8px;align-items:flex-end}
.chatform textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px;font-size:15px;resize:none;font-family:var(--body);color:var(--ink)}
.warn{font-size:13px;line-height:1.4;background:color-mix(in srgb,var(--hot) 18%,var(--surface));border-radius:10px;padding:8px 10px;margin-top:6px}
.swapbtn{display:block;margin-top:6px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.warnbox{background:color-mix(in srgb,var(--hot) 14%,var(--surface))}
.flag{font-size:12px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--hot) 35%,transparent);border-radius:6px;padding:1px 6px;white-space:nowrap}
.care ul{margin:4px 0 0;padding-left:18px;font-size:14px}.care li{margin:2px 0}
fieldset.restr{border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;margin:0;display:flex;flex-direction:column;gap:2px}
fieldset.restr legend{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 4px}
fieldset.restr .tog{padding:6px 0;font-size:15px}
.brand .up{color:var(--accent)}
.pf fieldset.restr label.tog{flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:15px;font-weight:500;color:var(--ink);text-align:left;padding:6px 0}
.pf fieldset.restr label.tog input{flex:none;width:20px;height:20px;margin:0}
.adapted{font-size:13px;color:var(--good);font-weight:600}
.flag.ok{background:var(--good-soft);color:var(--good)}
.brandrow{display:flex;align-items:center;gap:9px}
.logo{width:34px;height:34px;flex:none;border-radius:9px;display:block}
.avatar{margin-left:auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--sunk);color:var(--muted);display:grid;place-items:center;padding:0;overflow:hidden;font-family:var(--display);font-weight:800;font-size:18px}
.avatar.on{border-color:var(--accent)}
.avatar img,.av img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg,.av svg{width:60%;height:60%}
.av{border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;overflow:hidden;flex:none;font-family:var(--display);font-weight:800}
.av.sm{width:44px;height:44px;font-size:20px}.av.md{width:52px;height:52px;font-size:22px}.av.xl{width:120px;height:120px;font-size:48px}
.hello{display:flex;align-items:center;gap:12px}
.hello-n{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase}
.welcome{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input{text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink)}
.howbtn{display:inline-block;margin:6px 0 2px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--accent)}
.howic{color:var(--accent);font-weight:800}
.linkbtn{border:0;background:none;padding:0;font:inherit;font-weight:600;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.chip.sm{font-size:15px;padding:6px 12px;min-width:0}
.glist{display:flex;flex-direction:column;gap:8px}
.gitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;color:var(--ink)}
.gitem img,.gnoimg{width:84px;height:58px;border-radius:8px;object-fit:cover;flex:none;background:var(--sunk)}
.gnoimg{display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.gtxt{display:flex;flex-direction:column;min-width:0;flex:1}.gtxt b{font-size:15px}.gtxt span{font-size:13px;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:50;background:rgb(0 0 0 / .5);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.gfig{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/2;max-width:100%;background:var(--sunk)}
.gfig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
#gimg1{opacity:0}
.gfig-l{position:absolute;left:8px;bottom:8px;background:rgb(0 0 0 / .6);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px}
.gsec p{margin:4px 0 0}.gsec ol,.gsec ul{margin:6px 0 0;padding-left:20px}.gsec li{margin:4px 0}
.errs li::marker{color:var(--danger)}
.gtip{background:var(--good-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
body.noscroll{overflow:hidden}
@media (prefers-reduced-motion:reduce){#gimg1{display:none}}
.btn.sm{white-space:nowrap}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
.welcome .row{flex-wrap:wrap}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:40;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:380px){.sets{grid-template-columns:28px 1fr 1fr 48px}.chk{width:48px}.ed-grid{grid-template-columns:56px 1fr 1fr}.ed-grid .tog{grid-column:1/-1;padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brandrow"><img class="logo" src="logo-mark.png" alt="" width="34" height="34"><div class="brand"><span class="up">Up</span> Anilha</div></div>
    <span id="sync" hidden><i></i><span></span></span>
    <button class="avatar" id="avatarBtn" aria-label="Seu perfil"></button>
  </header>
  <main id="main"></main>
</div>
<div class="rest" id="rest" hidden>
  <div class="rest-in">
    <div class="clock" id="restClock">1:30</div>
    <div class="lbl" id="restLbl">Descanso</div>
    <button id="restMinus" aria-label="Menos 15 segundos">−15</button>
    <button id="restPlus" aria-label="Mais 15 segundos">+15</button>
    <button id="restSkip">Pular</button>
  </div>
</div>
<nav class="tabs" aria-label="Seções">
  <div class="in">
    <button data-view="hoje" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Treino</button>
    <button data-view="rotina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Rotina</button>
    <button data-view="guia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Guia</button>
    <button data-view="personal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>Personal</button>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Como fazer o exercício"><div class="sheet-in" id="sheetIn"></div></div>
<script src="guide.js"></script>
<script>
(function(){
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtKg=n=>(Math.round(n*100)/100).toLocaleString('pt-BR');
const E=(name,sets,reps,rest,bar)=>({id:uid(),name,sets,reps,rest,bar:!!bar});
const DEFAULT_PLAN={v:2,next:'A',goals:{week:5,month:20},workouts:[
 {id:'A',day:1,name:'Peito e tríceps',ex:[E('Supino inclinado com halteres',3,'10-12',75),E('Supino reto',3,'8-10',90,1),E('Crucifixo (crossover ou halter)',3,'12-15',60),E('Tríceps pulley (corda)',3,'12',60),E('Tríceps testa',3,'10',60)]},
 {id:'B',day:2,name:'Costas e bíceps',ex:[E('Puxada alta aberta',3,'10-12',75),E('Remada baixa (triângulo)',3,'10',75),E('Remada curvada com halteres',3,'12',75),E('Rosca direta (barra W)',3,'10',60),E('Rosca martelo',3,'12',60)]},
 {id:'C',day:3,name:'Cardio e abdominal',ex:[E('Cardio: caminhada inclinada ou bike',1,'30-40 min',0),E('Abdominal supra',3,'20',45),E('Elevação de pernas',3,'15',45),E('Prancha',3,'45-60 s',45)]},
 {id:'D',day:4,name:'Pernas e ombros',ex:[E('Leg press 45°',3,'12',90),E('Cadeira extensora',3,'15',60),E('Mesa flexora',3,'12',60),E('Panturrilha sentada',4,'15',45),E('Desenvolvimento com halteres',3,'10',75),E('Elevação lateral',3,'12-15',60)]},
 {id:'E',day:5,name:'Full body em circuito',ex:[E('Afundo (passada), cada perna',3,'12',60),E('Supino reto com halteres',3,'10',60),E('Puxada alta',3,'10',60),E('Elevação lateral',3,'15',45),E('Rosca direta (super-série)',3,'12',0),E('Tríceps pulley (super-série)',3,'12',75)]}
]};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const S={user:LS.get('ct.user',{name:'',photo:'',skip:false}),chat:LS.get('ct.chat',[]),draft:'',busy:null,plan:LS.get('ct.plan',null)||JSON.parse(JSON.stringify(DEFAULT_PLAN)),sessions:LS.get('ct.sessions',[]),active:LS.get('ct.active',null),view:'hoje',sel:null,edit:null,histEx:null,armed:null,rest:null};
if(S.plan.v!==2&&!S.sessions.length){S.plan={...JSON.parse(JSON.stringify(DEFAULT_PLAN)),profile:S.plan.profile}}
let chatRef=null,sampleApi=null,planRef=null,sessCol=null,armTimer=null,saveTimer=null,audio=null,wake=null;
const main=document.getElementById('main');
function goals(){if(!S.plan.goals)S.plan.goals={week:4,month:16};return S.plan.goals}

function W(id){return S.plan.workouts.find(w=>w.id===id)||S.plan.workouts[0]}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- persistence ---------- */
function savePlan(){LS.set('ct.plan',S.plan);clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(planRef)planRef.set(JSON.parse(JSON.stringify(S.plan))).catch(()=>toast('Não consegui salvar a rotina na nuvem'))},500)}
function saveActive(){LS.set('ct.active',S.active)}
function addSession(s){S.sessions=[s,...S.sessions.filter(x=>x.id!==s.id)].sort((a,b)=>a.date<b.date?1:-1);LS.set('ct.sessions',S.sessions);if(sessCol)sessCol.doc(s.id).set(s).catch(()=>toast('Treino salvo só neste aparelho'))}
function delSession(id){S.sessions=S.sessions.filter(x=>x.id!==id);LS.set('ct.sessions',S.sessions);if(sessCol)sessCol.doc(id).delete().catch(()=>{})}
function setSync(on,txt){const el=document.getElementById('sync');el.classList.toggle('on',on);el.querySelector('span').textContent=txt}

async function connect(){
  if(!window.claude||!window.claude.use)return;
  let db,user;try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){return}
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const base=db.collection('data/users/'+id);
  planRef=base.doc('plan');sessCol=base.doc('log').collection('sessions');chatRef=base.doc('chat');
  chatRef.onSnapshot(snap=>{if(!snap.exists){if(S.chat.length)chatRef.set({msgs:S.chat.slice(-40)}).catch(()=>{});return}
    if(snap.metadata.hasPendingWrites||S.busy==='chat')return;const d=snap.data();if(d&&Array.isArray(d.msgs)){S.chat=d.msgs;LS.set('ct.chat',S.chat);updateChatLog()}},()=>{});
  let got=false;const to=setTimeout(()=>{if(!got)setSync(false,'Offline · salvo aqui')},10000);
  planRef.onSnapshot(snap=>{got=true;clearTimeout(to);setSync(true,'Sincronizado');
    if(!snap.exists){planRef.set(JSON.parse(JSON.stringify(S.plan))).catch(()=>{});return}
    if(snap.metadata.hasPendingWrites)return;
    const d=snap.data();if(!d||!Array.isArray(d.workouts))return;
    if(d.v!==2&&!S.sessions.length){planRef.set(JSON.parse(JSON.stringify(S.plan))).catch(()=>{});return}
    S.plan=d;LS.set('ct.plan',d);
    const editing=main.contains(document.activeElement)&&document.activeElement.tagName!=='BUTTON';
    if(!editing)render();
  },()=>setSync(false,'Offline · salvo aqui'));
  let migrated=false;
  sessCol.orderBy('date','desc').limit(400).onSnapshot(q=>{
    const remote=q.docs.map(d=>d.data());
    if(!migrated){migrated=true;const ids=new Set(remote.map(r=>r.id));S.sessions.filter(s=>!ids.has(s.id)).forEach(s=>sessCol.doc(s.id).set(s).catch(()=>{}));
      if(remote.length===0&&S.sessions.length)return;}
    if(q.metadata.hasPendingWrites)return;
    S.sessions=remote;LS.set('ct.sessions',remote);
    if(S.view!=='rotina')render();
  },()=>{});
}

/* ---------- helpers ---------- */
function lastFor(exId,name){for(const s of S.sessions){const e=s.ex.find(x=>x.exId===exId)||s.ex.find(x=>x.name===name);if(e&&e.sets.length)return{date:s.date,sets:e.sets}}return null}
function plates(kg){if(!(kg>20))return '';let side=(kg-20)/2;const out=[];for(const p of [25,20,15,10,5,2.5,1.25]){while(side>=p-1e-9){out.push(p);side-=p}}
  return 'Barra 20 + 2×('+out.map(fmtKg).join(' + ')+')'+(side>0.01?' ≈':'')}
function repsLow(r){const m=String(r).match(/\d+/);return m?m[0]:''}
function dayKey(d){const x=new Date(d);return x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate()}
function vol(s){return s.ex.reduce((a,e)=>a+e.sets.reduce((b,t)=>b+(+t.kg||0)*(+t.reps||0),0),0)}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}).replace('.','')}
function visitSet(){return new Set(S.sessions.map(s=>dayKey(s.date)))}
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x}
function visitsBetween(a,b){const days=new Set();S.sessions.forEach(s=>{const t=new Date(s.date);if(t>=a&&t<b)days.add(dayKey(t))});return days.size}
function streak(){const g=goals().week;let ws=weekStart(new Date()),n=0;const cur=visitsBetween(ws,new Date(ws.getTime()+7*864e5));if(cur>=g)n++;
  for(let i=0;i<104;i++){const b=ws;ws=new Date(ws);ws.setDate(ws.getDate()-7);if(visitsBetween(ws,b)>=g)n++;else break}return n}
function todayCheckin(){const k=dayKey(new Date());return S.sessions.find(s=>s.checkin&&dayKey(s.date)===k)}
function arm(key){S.armed=key;clearTimeout(armTimer);armTimer=setTimeout(()=>{S.armed=null;render()},3500)}

/* ---------- views ---------- */
function weekStrip(){const now=new Date();const start=new Date(now);start.setHours(0,0,0,0);start.setDate(start.getDate()-start.getDay());
  const days=new Set(S.sessions.map(s=>dayKey(s.date)));const L=['D','S','T','Q','Q','S','S'];let h='',n=0;
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const done=days.has(dayKey(d));if(done)n++;
    h+=`<div><span>${L[i]}</span><b class="${done?'done':''} ${dayKey(d)===dayKey(now)?'today':''}" title="${d.toLocaleDateString('pt-BR')}"></b></div>`}
  return {html:`<div class="week">${h}</div>`,n}}

function viewHoje(){
  if(S.active)return viewSession();
  const todayW=S.plan.workouts.find(x=>x.day===new Date().getDay());const sel=S.sel||(todayW&&todayW.id)||S.plan.next||S.plan.workouts[0].id;const w=W(sel);const wk=weekStrip();
  return `<div class="stack">
    ${welcomeCard()}
    ${freqCard(wk)}
    <div class="stack" style="gap:10px">
      <div class="eyebrow">Escolha o treino</div>
      <div class="chips">${S.plan.workouts.map(x=>`<button class="chip" data-act="pick" data-id="${x.id}" aria-pressed="${x.id===w.id}">${x.day!=null?DAYN[x.day].slice(0,3):esc(x.id)}</button>`).join('')}</div>
    </div>
    <div class="card stack">
      <div class="row"><div class="plate">${esc(w.id)}</div><div style="min-width:0"><div class="eyebrow">${w.day!=null?DAYN[w.day]+(w===todayW?' · hoje':''):(w.id===S.plan.next?'Próximo da rotina':'Treino '+esc(w.id))} · ~${estMin(w)} min</div><h2>${esc(w.name)}</h2></div></div>
      <ul class="exlist">${w.ex.map(e=>{const l=lastFor(e.id,e.name);const top=l?Math.max(...l.sets.map(t=>+t.kg||0)):0;
        return `<li><div class="n"><button class="linkbtn" data-act="how" data-name="${esc(e.name)}">${esc(e.name)}</button>${issues(e.name).length?' <span class="flag">⚠ adaptar</span>':''}${e.orig?' <span class="flag ok">adaptado</span>':''}${top?`<div class="muted num" style="font-size:13px;font-weight:400">Última: ${fmtKg(top)} kg</div>`:''}</div><div class="t">${e.sets} × ${esc(e.reps)}<br>${mmss(e.rest)}</div></li>`}).join('')||'<li class="muted">Sem exercícios. Adicione na aba Rotina.</li>'}</ul>
      <button class="btn primary big" data-act="start" data-id="${w.id}" ${w.ex.length?'':'disabled'}>Começar treino ${esc(w.id)}</button>
    </div>
  </div>`}

function freqCard(wk){const g=goals(),now=new Date(),m0=new Date(now.getFullYear(),now.getMonth(),1),m1=new Date(now.getFullYear(),now.getMonth()+1,1);
  const mv=visitsBetween(m0,m1),went=visitSet().has(dayKey(now)),ck=todayCheckin(),st=streak(),pctW=Math.min(100,wk.n/g.week*100),pctM=Math.min(100,mv/g.month*100);
  const month=now.toLocaleDateString('pt-BR',{month:'long'});
  return `<div class="card stack">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><div class="eyebrow">Meta da semana</div><div class="big num"><b>${wk.n}</b><span>/ ${g.week}</span></div></div>
      <div style="text-align:right"><div class="eyebrow">Sequência</div><div class="num" style="font-family:var(--display);font-weight:700;font-size:22px">${st} ${st===1?'semana':'semanas'}</div></div>
    </div>
    ${wk.html}
    <div class="progress"><i style="width:${pctW}%;background:${wk.n>=g.week?'var(--good)':'var(--accent)'}"></i></div>
    <div class="muted" style="font-size:14px">${wk.n>=g.week?'Meta da semana batida.':`Faltam ${g.week-wk.n} ${g.week-wk.n===1?'ida':'idas'} para a meta.`}</div>
    ${went?`<div class="row"><div class="btn checked" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px">✓ Você foi hoje</div>${ck?`<button class="btn ghost sm" data-act="uncheck" data-id="${ck.id}">Desfazer</button>`:''}</div>`
      :`<button class="btn primary big" data-act="checkin">Fazer check-in</button>`}
    <div class="mrow"><div class="row" style="justify-content:space-between"><span class="eyebrow">Em ${month}</span><span class="num" style="font-weight:700">${mv} / ${g.month}</span></div>
      <div class="progress"><i style="width:${pctM}%;background:${mv>=g.month?'var(--good)':'var(--accent)'}"></i></div></div>
    <details class="goals"><summary>Ajustar metas</summary>
      <div class="row" style="justify-content:space-between;margin-top:10px"><span>Idas por semana</span><span class="stepper"><button class="ic" data-act="goal" data-g="week" data-d="-1" aria-label="Diminuir meta semanal">−</button><b class="num">${g.week}</b><button class="ic" data-act="goal" data-g="week" data-d="1" aria-label="Aumentar meta semanal">+</button></span></div>
      <div class="row" style="justify-content:space-between;margin-top:8px"><span>Idas por mês</span><span class="stepper"><button class="ic" data-act="goal" data-g="month" data-d="-1" aria-label="Diminuir meta mensal">−</button><b class="num">${g.month}</b><button class="ic" data-act="goal" data-g="month" data-d="1" aria-label="Aumentar meta mensal">+</button></span></div>
    </details>
  </div>`}

const PROFILE_DEF={goal:'hipertrofia',minutes:60,days:4,level:'intermediario',place:'academia',notes:''};
const OPTS={goal:[['hipertrofia','Ganhar massa muscular'],['emagrecimento','Emagrecer e definir'],['forca','Ganhar força'],['condicionamento','Condicionamento físico'],['saude','Saúde e mobilidade']],
 minutes:[[30,'30 min'],[45,'45 min'],[60,'1 hora'],[75,'1h15'],[90,'1h30']],days:[[2,'2 dias'],[3,'3 dias'],[4,'4 dias'],[5,'5 dias'],[6,'6 dias']],
 level:[['iniciante','Iniciante'],['intermediario','Intermediário'],['avancado','Avançado']],
 place:[['academia','Academia completa'],['academia_simples','Academia pequena / de prédio'],['casa','Em casa com halteres']]};
const lbl=(k,v)=>((OPTS[k].find(o=>String(o[0])===String(v))||[])[1]||v);
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const RESTR={
 lombar:{label:'Hérnia de disco lombar ou dor lombar',short:'Lombar',
  tips:['Mantenha a coluna neutra e o abdômen firme em todos os exercícios.','Prefira máquinas e exercícios com apoio nas costas ou no peito.','Inclua prancha, ponte e perdigueiro (bird dog) para fortalecer o core.','Dor que desce para a perna, formigamento ou dormência: pare e procure seu médico.'],
  swaps:[[/agachamento (livre|com barra)|^agachamento$/,'Leg press 45°','A barra nas costas comprime os discos da lombar. No leg press a coluna fica apoiada; não deixe o quadril sair do banco.'],
   [/stiff|levantamento terra|^terra|bom dia|good ?morning/,'Mesa flexora','Inclinar o tronco com carga sobrecarrega os discos lombares.'],
   [/remada curvada/,'Remada apoiada no peito (máquina ou cavalinho com apoio)','O apoio no peito tira a carga da lombar. Outra opção é o serrote, com mão e joelho no banco.'],
   [/desenvolvimento (com barra|militar|em pe)/,'Desenvolvimento sentado na máquina','Sentado e com encosto, a coluna não compensa o movimento.'],
   [/panturrilha em pe/,'Panturrilha sentada','Em pé, a carga desce pela coluna.'],
   [/rosca direta/,'Rosca com halteres sentado','Com encosto você evita balançar o tronco para subir o peso.'],
   [/abdominal (supra|remador|infra)|sit.?up|crunch/,'Prancha','Flexionar a coluna repetidas vezes aumenta a pressão no disco.']]},
 cervical:{label:'Hérnia de disco cervical ou dor no pescoço',short:'Cervical',
  tips:['Mantenha o queixo levemente recolhido e o olhar para frente.','Evite carga apoiada no pescoço e no trapézio.','Formigamento no braço ou na mão: pare e procure seu médico.'],
  swaps:[[/agachamento (livre|com barra)|^agachamento$/,'Leg press 45°','A barra apoiada no trapézio pressiona a coluna cervical.'],
   [/desenvolvimento/,'Elevação lateral','Empurrar peso acima da cabeça comprime a cervical.'],
   [/encolhimento/,'Face pull na polia','Encolhimento com carga tensiona o pescoço.'],
   [/abdominal (supra|remador)|crunch/,'Prancha','Puxar o pescoço no abdominal irrita a cervical.']]},
 joelho:{label:'Dor ou lesão no joelho',short:'Joelho',
  tips:['Joelho sempre alinhado com a ponta do pé.','Evite impacto e flexão profunda com carga.','Aqueça de 5 a 10 minutos na bicicleta.'],
  swaps:[[/agachamento|afundo|avanco|passada|bulgaro/,'Elevação pélvica','Flexão profunda do joelho com carga aumenta a pressão na patela.'],
   [/^cadeira extensora$/,'Cadeira extensora (amplitude parcial)','A parte final da extensão com carga é a que mais força a patela. Faça de 90° até 45°.'],
   [/salto|pliometri|burpee/,'Bicicleta ergométrica','O impacto sobrecarrega o joelho.']]},
 ombro:{label:'Dor ou lesão no ombro',short:'Ombro',
  tips:['Nos empurrões, mantenha os cotovelos um pouco à frente do corpo.','Evite levar peso acima da cabeça se doer.','Inclua rotação externa com elástico no aquecimento.'],
  swaps:[[/supino (reto|inclinado|declinado)(?!.*halter)/,'Supino com halteres, pegada neutra','A pegada neutra protege o manguito rotador.'],
   [/desenvolvimento/,'Elevação lateral até a altura do ombro','Levar peso acima da cabeça pode pinçar o ombro.'],
   [/mergulho|paralelas|triceps banco/,'Tríceps na polia','O mergulho joga o ombro para frente sob carga.'],
   [/triceps (frances|testa)/,'Tríceps na polia com corda','Braço acima da cabeça com carga pode pinçar o ombro.'],
   [/nuca/,'Puxada frontal','Puxar atrás da nuca força a rotação do ombro.']]},
 pressao:{label:'Pressão alta',short:'Pressão',
  tips:['Não prenda a respiração: solte o ar na hora do esforço.','Prefira de 10 a 15 repetições com carga moderada e não vá até a falha.','Tontura, dor de cabeça forte ou dor no peito: pare na hora.'],swaps:[]}};
function restr(){const p=profile();if(!Array.isArray(p.restr))p.restr=[];return p.restr}
function issues(name){const n=norm(name),out=[];restr().forEach(k=>{const R=RESTR[k];if(!R)return;const sw=R.swaps.find(x=>x[0].test(n)&&norm(x[1])!==n);if(sw)out.push({k,short:R.short,to:sw[1],why:sw[2]})});return out}
function adaptEx(e){let changed=false;for(let i=0;i<3;i++){const is=issues(e.name);if(!is.length)break;e.name=is[0].to;e.bar=false;changed=true}return changed}
function adaptPlan(){let n=0;const hp=restr().includes('pressao');
  S.plan.workouts.forEach(w=>w.ex.forEach(e=>{if(!e.orig)e.orig={name:e.name,bar:!!e.bar,reps:e.reps};
    const before=e.name+'|'+e.reps;e.name=e.orig.name;e.bar=e.orig.bar;e.reps=e.orig.reps;adaptEx(e);
    if(hp){const lo=parseInt(String(e.reps));if(lo&&lo<10)e.reps='12-15'}
    if(e.name+'|'+e.reps!==before)n++;
    if(e.name===e.orig.name&&e.reps===e.orig.reps)delete e.orig}));return n}
function restrText(){const r=restr();if(!r.length)return 'nenhuma';return r.map(k=>RESTR[k].label).join('; ')+'. Trocas obrigatórias: '+r.flatMap(k=>RESTR[k].swaps.map(x=>x[1])).filter((v,i,a)=>a.indexOf(v)===i).join(', ')+' no lugar dos exercícios de risco para essas condições'}
function careCard(){const r=restr().filter(k=>RESTR[k]);if(!r.length)return '';
  return `<div class="card care stack"><div class="eyebrow">Cuidados para você</div>${r.map(k=>`<div><b>${RESTR[k].short}</b><ul>${RESTR[k].tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}<div class="muted" style="font-size:13px">Treine com liberação do seu médico ou fisioterapeuta. Dor diferente do cansaço muscular é sinal para parar.</div></div>`}
function warnHtml(name,act,attrs){return issues(name).map(i=>`<div class="warn"><b>⚠ ${esc(i.short)}:</b> ${esc(i.why)}${act?` <button class="btn sm swapbtn" data-act="${act}" ${attrs} data-to="${esc(i.to)}">Trocar por ${esc(i.to)}</button>`:''}</div>`).join('')}
function profile(){if(!S.plan.profile)S.plan.profile={...PROFILE_DEF};return S.plan.profile}
function estMin(w){return Math.round((300+w.ex.reduce((a,e)=>a+e.sets*(40+(+e.rest||60)),0))/60)}
const DAYN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const RESTS=[30,45,60,75,90,120,150,180,240];
function normWorkouts(ws){if(!Array.isArray(ws))return [];const old=new Map();S.plan.workouts.forEach(w=>w.ex.forEach(e=>old.set(e.name.toLowerCase(),e.id)));
  return ws.slice(0,7).map((w,i)=>({id:'ABCDEFG'[i],name:String(w&&w.name||'Treino '+'ABCDEFG'[i]).slice(0,60),
    ex:(Array.isArray(w&&w.ex)?w.ex:[]).slice(0,12).filter(e=>e&&e.name).map(e=>{const r=+e.rest||60;return{id:old.get(String(e.name).toLowerCase())||uid(),name:String(e.name).slice(0,60),
      sets:Math.max(1,Math.min(10,Math.round(+e.sets||3))),reps:String(e.reps||'10').slice(0,12),rest:RESTS.reduce((a,b)=>Math.abs(b-r)<Math.abs(a-r)?b:a),bar:!!e.bar}})})).filter(w=>w.ex.length)}
function ctx(){const p=profile(),g=goals();
  const plan=S.plan.workouts.map(w=>`Treino ${w.id}${w.day!=null?' ('+DAYN[w.day]+')':''} – ${w.name} (~${estMin(w)} min): `+w.ex.map(e=>`${e.name} ${e.sets}x${e.reps}, descanso ${e.rest}s${e.bar?' [barra]':''}`).join('; ')).join('\n');
  const hist=S.sessions.slice(0,12).map(s=>s.checkin?`${s.date.slice(0,10)}: check-in`:`${s.date.slice(0,10)}: treino ${s.workoutId}, ${Math.round(s.durationSec/60)} min – `+s.ex.map(e=>`${e.name} ${e.sets.map(t=>t.kg+'kg×'+t.reps).join(', ')}`).join('; ')).join('\n')||'nenhum ainda';
  return `Você é o personal trainer do aluno dentro do app Up Anilha. Responda em português do Brasil, de forma direta e prática, com no máximo uns 120 palavras, a menos que o aluno peça detalhes. Use frases curtas e, se precisar de lista, linhas começando com "- ". Não use markdown com asteriscos ou títulos.
Você pode mudar a rotina com a ferramenta atualizar_rotina (sempre mande a rotina completa, todos os treinos) e as metas de frequência com atualizar_metas. Só use quando o aluno pedir ou concordar, e depois diga o que mudou. Mantenha cada treino dentro do tempo do aluno.
Se ele relatar dor forte, lesão ou sintoma estranho, oriente procurar médico ou fisioterapeuta. Não prescreva dieta detalhada nem doses de suplemento.

Aluno: ${S.user.name||'sem nome'}.
Hoje: ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
Perfil: objetivo ${lbl('goal',p.goal)}; ${p.minutes} min por treino; ${p.days} dias por semana; nível ${lbl('level',p.level)}; local: ${lbl('place',p.place)}. Observações: ${p.notes||'nenhuma'}.
Restrições de saúde: ${restrText()}. Nunca sugira exercícios contraindicados para essas condições; prefira variações com apoio e explique o motivo da troca.
Metas: ${g.week} idas por semana, ${g.month} por mês. Idas nesta semana: ${weekStrip().n}. Próximo treino sugerido: ${S.plan.next}.
Rotina atual:
${plan}
Últimos registros:
${hist}`}
const TOOLS=[
 {name:'atualizar_rotina',description:'Substitui a rotina inteira do aluno (todos os treinos A, B, C...). Mande todos os treinos, inclusive os que não mudaram.',
  inputSchema:{type:'object',properties:{workouts:{type:'array',items:{type:'object',properties:{name:{type:'string',description:'Ex.: Peito e tríceps'},ex:{type:'array',items:{type:'object',properties:{name:{type:'string'},sets:{type:'integer'},reps:{type:'string',description:'Ex.: 8-10'},rest:{type:'integer',description:'Descanso em segundos'},bar:{type:'boolean',description:'true só para exercício com barra olímpica livre'}},required:['name','sets','reps','rest']}}},required:['name','ex']}}},required:['workouts']},
  execute(inp){const ws=normWorkouts(inp.workouts);if(!ws.length)throw new Error('Rotina vazia');ws.forEach(w=>w.ex.forEach(adaptEx));S.plan.workouts=ws;if(!ws.some(w=>w.id===S.plan.next))S.plan.next=ws[0].id;S.edit=null;savePlan();toast('Rotina atualizada pelo personal');return 'Rotina salva: '+ws.map(w=>w.id+' '+w.name+' (~'+estMin(w)+' min)').join('; ')}},
 {name:'atualizar_metas',description:'Muda as metas de frequência do aluno.',inputSchema:{type:'object',properties:{semana:{type:'integer',description:'Idas por semana, 1 a 7'},mes:{type:'integer',description:'Idas por mês, 1 a 31'}}},
  execute(inp){const g=goals();if(inp.semana)g.week=Math.max(1,Math.min(7,+inp.semana));if(inp.mes)g.month=Math.max(1,Math.min(31,+inp.mes));savePlan();return `Metas: ${g.week}/semana, ${g.month}/mês`}}];
const API_MODEL='claude-sonnet-5-5';
function apiKey(){return LS.get('ct.key','')}
async function callApi(body){let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':apiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)})}catch(e){throw {code:'offline'}}
  const j=await r.json().catch(()=>({}));const m=(j.error&&j.error.message)||'';
  if(!r.ok)throw {code:r.status===401?'bad_key':r.status===429?'rate_limited':/credit|billing/i.test(m)?'no_credit':'api',message:m};return j}
function makeSample(){
  const f=async(messages,opts={})=>{const msgs=messages.map(m=>({role:m.role,content:m.content}));const tools=(opts.tools||[]).map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema||{type:'object'}}));
    for(let i=0;i<5;i++){const j=await callApi({model:API_MODEL,max_tokens:1500,messages:msgs,...(tools.length?{tools}:{})});
      const text=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
      if(j.stop_reason!=='tool_use'){opts.onText&&opts.onText({text,delta:text});return {text}}
      msgs.push({role:'assistant',content:j.content});const results=[];
      for(const c of j.content.filter(c=>c.type==='tool_use')){const tool=opts.tools.find(t=>t.name===c.name);let out,err=false;try{out=String(await tool.execute(c.input||{},{}))}catch(e){out=String((e&&e.message)||e);err=true}results.push({type:'tool_result',tool_use_id:c.id,content:out,is_error:err})}
      msgs.push({role:'user',content:results})}
    return {text:'Pronto, fiz as alterações.'}};
  f.json=async prompt=>{const j=await callApi({model:API_MODEL,max_tokens:4000,messages:[{role:'user',content:prompt}]});const t=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');const m=t.match(/\{[\s\S]*\}/);if(!m)throw {code:'empty'};return JSON.parse(m[0])};
  return f}
function errMsg(e){const c=e&&e.code;return c==='bad_key'?'Chave da API inválida. Confira na aba Personal.':c==='no_credit'?'Sua conta da API está sem créditos. Adicione em console.anthropic.com.':c==='offline'?'Sem internet agora. O personal precisa de conexão.':c==='not_granted'?'Você precisa permitir o personal nesta página.':c==='rate_limited'?'Muitos pedidos seguidos. Espere um minuto e tente de novo.':'Não consegui falar com o personal agora. Tente de novo.'}
function saveChat(){S.chat=S.chat.slice(-40);LS.set('ct.chat',S.chat);if(chatRef)chatRef.set({msgs:S.chat}).catch(()=>{})}
function fmtMsg(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'$1').replace(/\n/g,'<br>')}
function chatHtml(){const intro=`<div class="msg ai">Oi! Sou seu personal. Já conheço sua rotina, suas metas e seus registros. Pode me pedir para trocar um exercício, encaixar o treino em menos tempo, montar um aquecimento ou tirar dúvidas de execução.</div>`;
  return intro+S.chat.map(m=>`<div class="msg ${m.role==='user'?'me':'ai'}">${fmtMsg(m.content)}</div>`).join('')+(S.busy==='chat'?`<div class="msg ai">${S.streaming?fmtMsg(S.streaming):'<span class="dots">Pensando…</span>'}</div>`:'')}
function updateChatLog(){const el=document.getElementById('chatlog');if(!el)return;el.innerHTML=chatHtml();const l=el.lastElementChild;if(l&&S.busy)l.scrollIntoView({block:'nearest'})}
async function sendChat(text){text=text.trim();if(!text||S.busy||!sampleApi)return;
  S.chat.push({role:'user',content:text});S.draft='';S.busy='chat';S.streaming='';saveChat();render();
  let msgs=S.chat.slice(-16).map(m=>({role:m.role,content:m.content}));while(msgs.length&&msgs[0].role!=='user')msgs.shift();
  const merged=[];msgs.forEach(m=>{const l=merged[merged.length-1];if(l&&l.role===m.role)l.content+='\n\n'+m.content;else merged.push({...m})});
  merged[merged.length-1].content=ctx()+'\n\nMensagem do aluno: '+merged[merged.length-1].content;
  const opts={cache:false,onText:u=>{S.streaming=u.text;updateChatLog()}};
  try{let r;try{r=await sampleApi(merged,{...opts,tools:TOOLS})}catch(e){if(e&&e.code==='tools_unavailable')r=await sampleApi(merged,opts);else throw e}
    S.chat.push({role:'assistant',content:r.text||'…'})}
  catch(e){S.chat.push({role:'assistant',content:(e&&e.text)||errMsg(e)})}
  S.busy=null;S.streaming='';saveChat();render();}
async function generate(){if(!sampleApi||S.busy)return;const p=profile();S.busy='gen';render();
  const prompt=`Monte uma rotina de musculação para este aluno e responda só com JSON.
Perfil: objetivo ${lbl('goal',p.goal)}; ${p.minutes} minutos por treino; ${p.days} dias por semana; nível ${lbl('level',p.level)}; local: ${lbl('place',p.place)}. Observações do aluno: ${p.notes||'nenhuma'}.
Restrições de saúde: ${restrText()}.
Regras:
- Respeite as restrições de saúde: nada de carga axial ou flexão de coluna com peso se houver hérnia; prefira máquinas e exercícios com apoio; inclua um exercício de core seguro (prancha, ponte, perdigueiro) quando houver problema na coluna.
- Escolha a divisão certa para ${p.days} dias por semana (de 1 a ${Math.min(p.days,5)} treinos diferentes, chamados A, B, C... que se alternam).
- Cada treino precisa caber em ${p.minutes} minutos. Calcule cerca de 40 s por série mais o descanso, mais 5 min de aquecimento.
- Respeite o nível, o local, os equipamentos disponíveis e as observações (lesões e preferências).
- Use nomes de exercícios comuns nas academias do Brasil.
- reps como texto, ex. "8-10"; rest em segundos entre 30 e 240; bar=true só para exercícios com barra olímpica livre (supino reto com barra, agachamento livre, terra, remada curvada, desenvolvimento com barra, stiff, rosca direta com barra).
Formato: {"workouts":[{"name":"Peito e tríceps","ex":[{"name":"Supino reto","sets":4,"reps":"8-10","rest":120,"bar":true}]}],"resumo":"2 ou 3 frases para o aluno explicando a divisão e como progredir"}`;
  try{const r=await sampleApi.json(prompt,{modelTier:'default'});const ws=normWorkouts(r&&r.workouts);if(!ws.length)throw {code:'empty'};ws.forEach(w=>w.ex.forEach(adaptEx));
    S.plan.workouts=ws;S.plan.next=ws[0].id;S.sel=null;S.edit=null;const g=goals();g.week=+p.days;g.month=Math.round(p.days*4.3);savePlan();
    S.chat.push({role:'assistant',content:`Montei sua rotina ${ws.map(w=>w.id).join('/')} para ${p.days} dias por semana, com ${ws.map(w=>`${w.id} (~${estMin(w)} min)`).join(', ')}. ${r.resumo||''}\nSua meta virou ${g.week} idas por semana. Veja tudo na aba Rotina ou me peça ajustes aqui.`});saveChat();
    toast('Treino criado!')}
  catch(e){toast(errMsg(e))}
  S.busy=null;render()}

    <button class="btn ghost sm ${S.armed==='reset'?'armed':''}" data-act="reset" style="align-self:center">${S.armed==='reset'?'Toque de novo para restaurar':'Restaurar rotina padrão'}</button>
  </div>`}

function chart(name){
  const pts=S.sessions.slice().reverse().map(s=>{const e=s.ex.find(x=>x.name===name);if(!e)return null;const m=Math.max(...e.sets.map(t=>+t.kg||0));return m>0?{d:s.date,v:m}:null}).filter(Boolean).slice(-20);
  if(pts.length<2)return `<p class="muted" style="margin:8px 0 0;font-size:14px">${pts.length?'Registre mais um treino com esse exercício para ver a evolução.':'Ainda sem cargas registradas para esse exercício.'}</p>`;
  const W_=320,H=150,L=38,R=14,T=16,B=24;let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  const step=hi-lo>40?10:hi-lo>12?5:2.5;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo){hi+=step;lo=Math.max(0,lo-step)}
  const x=i=>L+i*(W_-L-R)/(pts.length-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const ticks=[lo,(lo+hi)/2,hi];const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const last=pts[pts.length-1],first=pts[0],diff=last.v-first.v;
  return `<svg class="chart" viewBox="0 0 ${W_} ${H}" role="img" aria-label="Carga máxima de ${esc(name)} por treino">
    ${ticks.map(t=>`<line x1="${L}" x2="${W_-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${fmtKg(t)}</text>`).join('')}
    <path d="${line}L${x(pts.length-1)},${H-B}L${L},${H-B}Z" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('')}
    <text x="${L}" y="${H-6}" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${new Date(first.d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</text>
    <text x="${W_-R}" y="${H-6}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${new Date(last.d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</text>
  </svg><p class="num" style="margin:6px 0 0;font-size:14px"><b>${fmtKg(last.v)} kg</b> <span class="muted">· ${diff>=0?'+':''}${fmtKg(diff)} kg desde ${new Date(first.d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</span></p>`}

const GIDX=(window.GUIDE||[]).map(g=>({...g,rx:new RegExp(g.re)}));

   ${iss.map(i=>`<div class="warn"><b>⚠ ${esc(i.short)}:</b> ${esc(i.why)} Sugestão: ${esc(i.to)}.</div>`).join('')}

   <div class="row" style="flex-wrap:wrap"><a class="btn ghost" href="${ytUrl(title)}" target="_blank" rel="noopener">Ver vídeos</a>${sampleApi?`<button class="btn ghost" data-ask="${esc(title)}">Perguntar ao personal</button>`:''}</div>`;
  el.hidden=false;document.body.classList.add('noscroll');clearInterval(sheetTimer);

function backupCard(){return `<div class="card stack"><div class="eyebrow">Backup</div><p class="muted" style="margin:0;font-size:14px">Seus dados ficam só neste celular. Baixe um backup de vez em quando para não perder nada se trocar de aparelho.</p>

function viewHist(){

  const names=[...new Set(S.sessions.filter(s=>!s.checkin).flatMap(s=>s.ex.map(e=>e.name)))];if(!S.histEx||!names.includes(S.histEx))S.histEx=names[0];

/* ---------- session actions ---------- */
function startSession(id){
  const w=W(id);
  S.active={id:uid(),workoutId:w.id,name:w.name,start:Date.now(),ex:w.ex.map(e=>{const l=lastFor(e.id,e.name);
    return{exId:e.id,name:e.name,target:{sets:e.sets,reps:e.reps,rest:e.rest,bar:e.bar},sets:Array.from({length:e.sets},(_,i)=>{const p=l&&(l.sets[i]||l.sets[l.sets.length-1]);return{kg:p?String(p.kg):'',reps:'',done:false}})}})};
  saveActive();window.scrollTo(0,0);
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wake=l).catch(()=>{})}catch(e){}
}
function finishSession(){
  const a=S.active;const ex=a.ex.map(e=>({exId:e.exId,name:e.name,sets:e.sets.filter(s=>s.done).map(s=>({kg:+String(s.kg).replace(',','.')||0,reps:+s.reps||0}))})).filter(e=>e.sets.length);
  if(!ex.length){toast('Marque ao menos uma série como feita');return}
  addSession({id:a.id,date:new Date(a.start).toISOString(),workoutId:a.workoutId,name:a.name,durationSec:Math.round((Date.now()-a.start)/1000),ex});
  const ws=S.plan.workouts,i=ws.findIndex(w=>w.id===a.workoutId);S.plan.next=ws[(i+1)%ws.length].id;S.sel=null;savePlan();
  S.active=null;saveActive();S.rest=null;try{wake&&wake.release()}catch(e){}
  toast('Treino salvo. Próximo: '+S.plan.next);
}
function beep(){try{if(!audio)return;[0,.25,.5].forEach(t=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.setValueAtTime(.25,audio.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+t+.18);o.connect(g).connect(audio.destination);o.start(audio.currentTime+t);o.stop(audio.currentTime+t+.2)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

/* ---------- timers ---------- */
const restEl=document.getElementById('rest');
function tick(){
  const el=document.getElementById('elapsed');if(el&&S.active)el.textContent=mmss((Date.now()-S.active.start)/1000);
  if(S.rest){const left=(S.rest.end-Date.now())/1000;restEl.hidden=false;
    if(left<=0&&!S.rest.fired){S.rest.fired=true;beep()}
    restEl.classList.toggle('done',left<=0);
    document.getElementById('restClock').textContent=left>0?mmss(left):'0:00';
    document.getElementById('restLbl').textContent=left>0?'Descanso · '+S.rest.label:'Hora da próxima série';
    if(left<-20)S.rest=null;
  }else restEl.hidden=true;
}
setInterval(tick,250);
document.getElementById('restMinus').onclick=()=>{if(S.rest){S.rest.end-=15000;S.rest.fired=false;tick()}};
document.getElementById('restPlus').onclick=()=>{if(S.rest){S.rest.end=Math.max(S.rest.end,Date.now())+15000;S.rest.fired=false;tick()}};

    case 'checkin':addSession({id:uid(),date:new Date().toISOString(),checkin:true,workoutId:'✓',name:'Check-in',durationSec:0,ex:[]});toast('Check-in feito. Bom treino!');break;
    case 'uncheck':delSession(b.dataset.id);break;
    case 'goal':{const g=goals(),k=b.dataset.g,max=k==='week'?7:31;g[k]=Math.max(1,Math.min(max,g[k]+(+b.dataset.d)));S.goalsOpen=true;savePlan();break}
    case 'go':S.view=b.dataset.v;break;
    case 'start':startSession(b.dataset.id);break;
    case 'done':{const s=a.ex[ei].sets[si];s.done=!s.done;
      if(s.done){if(!s.reps)s.reps=repsLow(a.ex[ei].target.reps);const isLast=a.ex[ei].sets.every(x=>x.done)&&ei===a.ex.length-1;
        if(!isLast&&a.ex[ei].target.rest>0){S.rest={end:Date.now()+a.ex[ei].target.rest*1000,label:a.ex[ei].name,fired:false}}
        const nx=a.ex[ei].sets[si+1];if(nx&&!nx.kg)nx.kg=s.kg;}
      saveActive();break}
    case 'addset':{const st=a.ex[ei].sets;const p=st[st.length-1];st.push({kg:p?p.kg:'',reps:'',done:false});saveActive();break}
    case 'rmset':a.ex[ei].sets.pop();saveActive();break;
    case 'finish':if(!twoStep('finish'))return;finishSession();break;
    case 'discard':if(!twoStep('discard'))return;S.active=null;S.rest=null;saveActive();try{wake&&wake.release()}catch(_){};break;
    case 'edsel':S.edit=b.dataset.id;break;
    case 'addw':{const used=new Set(S.plan.workouts.map(w=>w.id));const id='ABCDEFG'.split('').find(c=>!used.has(c));S.plan.workouts.push({id,name:'Novo treino',ex:[E('Novo exercício',3,'10',60)]});S.edit=id;savePlan();break}
    case 'rmw':if(!twoStep('rmw'))return;{const r=S.plan.workouts.splice(wi,1)[0];if(S.plan.next===r.id)S.plan.next=S.plan.workouts[0].id;S.edit=null;savePlan()}break;
    case 'addex':S.plan.workouts[wi].ex.push(E('Novo exercício',3,'10',60));savePlan();setTimeout(()=>{const ins=main.querySelectorAll('.ed-ex input[data-f=name]');const l=ins[ins.length-1];l&&(l.focus(),l.select())},0);break;
    case 'up':case 'down':{const ex=S.plan.workouts[wi].ex,j=act==='up'?xi-1:xi+1;[ex[xi],ex[j]]=[ex[j],ex[xi]];savePlan();break}
    case 'rmex':if(!twoStep(b.dataset.k))return;S.plan.workouts[wi].ex.splice(xi,1);savePlan();break;
    case 'reset':if(!twoStep('reset'))return;{const pf=S.plan.profile;S.plan=JSON.parse(JSON.stringify(DEFAULT_PLAN));S.plan.profile=pf}S.plan.workouts.forEach(w=>w.ex.forEach(x=>x.id=uid()));S.edit=null;savePlan();toast('Rotina padrão restaurada');break;
    case 'delsess':if(!twoStep('ds'+b.dataset.id))return;delSession(b.dataset.id);break;
  }
  S.armed=null;render();
});
main.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(t.id==='chatIn'){S.draft=t.value;return}
  if(t.id==='guideQ'){S.gq=t.value;document.getElementById('guideList').innerHTML=guideList();return}
  if(t.id==='welName'){S.draftName=t.value;return}
  if(f==='uname'){S.user.name=t.value;saveUser();return}if(!f)return;
  if(f==='restr'){const r=restr(),k=t.dataset.k;if(t.checked&&!r.includes(k))r.push(k);if(!t.checked)r.splice(r.indexOf(k),1);const n=adaptPlan();savePlan();render();
    toast(n?(t.checked?`Rotina adaptada: ${n} ${n===1?'exercício trocado':'exercícios ajustados'} para ${RESTR[k].short.toLowerCase()}`:`Rotina atualizada: ${n} ${n===1?'exercício voltou':'exercícios voltaram'} ao original`):(t.checked?'Sua rotina já é segura para '+RESTR[k].short.toLowerCase():'Restrição removida'));return}
  if(f==='pf'){const k=t.dataset.k;profile()[k]=['minutes','days'].includes(k)?+t.value:t.value;savePlan();return}
  if(t.dataset.e!=null&&S.active){const s=S.active.ex[+t.dataset.e].sets[+t.dataset.s];s[f]=t.value;saveActive();
    if(f==='kg'){const pc=document.getElementById('pc-'+t.dataset.e+'-'+t.dataset.s);if(pc)pc.textContent=plates(+String(t.value).replace(',','.'))}return}
  if(f==='wday'){S.plan.workouts[+t.dataset.w].day=t.value===''?null:+t.value;savePlan();return}
  if(f==='wname'){S.plan.workouts[+t.dataset.w].name=t.value;savePlan();return}
  if(t.dataset.x!=null){const ex=S.plan.workouts[+t.dataset.w].ex[+t.dataset.x];
    if(f==='name'||f==='reps')delete ex.orig;
    ex[f]=f==='bar'?t.checked:f==='sets'?Math.max(1,Math.min(10,+t.value||1)):f==='rest'?+t.value:t.value;savePlan()}
});
main.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();sendChat(S.draft)}});
main.addEventListener('change',e=>{if(e.target.id==='photoIn'){if(S.view==='hoje'){const w=document.getElementById('welName');if(w)S.draftName=w.value}processPhoto(e.target.files&&e.target.files[0]);return}
  if(e.target.id==='restoreIn'){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.plan||!Array.isArray(d.plan.workouts)||!Array.isArray(d.sessions))throw 0;
    S.plan=d.plan;S.sessions=d.sessions;S.chat=Array.isArray(d.chat)?d.chat:[];if(d.user&&typeof d.user==='object'){S.user=d.user;LS.set('ct.user',S.user)}LS.set('ct.plan',S.plan);LS.set('ct.sessions',S.sessions);LS.set('ct.chat',S.chat);toast('Backup restaurado');render()}catch(_){toast('Esse arquivo não é um backup do Up Anilha')}};r.readAsText(f);return}if(e.target.dataset.f==='histEx'){S.histEx=e.target.value;render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.active){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wake=l).catch(()=>{})}catch(e){}}});

if(apiKey())sampleApi=makeSample();
render();
if(apiKey())sampleApi=makeSample();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
